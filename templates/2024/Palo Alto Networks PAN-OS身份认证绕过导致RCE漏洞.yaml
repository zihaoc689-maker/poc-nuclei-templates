info:
  name: Palo Alto Networks PAN-OS身份认证绕过导致RCE漏洞
  author: hacktwo
  severity: high
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/qes7mlliyg9cy10p'
