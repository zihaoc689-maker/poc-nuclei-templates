id: poc-ymkq95v4gq82mgpk
info:
  name: 致远 OA A8 htmlofficeservlet 远程命令执行漏洞
  author: hacktwo
  severity: critical
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: rce,2024
http:
- raw:
  - 'GET /seeyon/htmlofficeservlet HTTP/1.1


    # 响应代码特征

    -1


    # 响应内容特征

    ^(?=.*?DBSTEP)(?=.*?htmoffice).*?$


    # 上传文件定位

    暂无'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
