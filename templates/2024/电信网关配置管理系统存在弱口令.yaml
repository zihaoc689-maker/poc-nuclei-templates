id: poc-mgfa4zk3h9rmrx77
info:
  name: 电信网关配置管理系统存在弱口令
  author: hacktwo
  severity: medium
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: default-login,2024
http:
- raw:
  - 'POST /manager/login.php HTTP/1.1


    Name=admin&Pass=admin'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
