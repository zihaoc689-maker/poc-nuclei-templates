http:
- raw:
  - 'POST /php/rj_get_token.php HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/57.0.2021.49 Safari/537.36

    Content-Type: application/x-www-form-urlencoded

