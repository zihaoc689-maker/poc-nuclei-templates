info:
  name: 心医国际WebPacs系统存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2025
http:
- raw:
  - 'POST /WebPacs/webpacs/studylistgrid HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36

    Content-type: application/x-www-form-urlencoded; charset=UTF-8

    Connection: close

    Content-Length: 154


    type=normal&jianchahao=&department=&filmstate=&truename=&devicetypename=&studystatus=&patienttype=&huanzhehao=&devicename=&datelength=7&page=1&pageSize=10'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
