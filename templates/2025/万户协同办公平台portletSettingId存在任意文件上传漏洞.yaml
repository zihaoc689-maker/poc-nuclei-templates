id: poc-dd9feb19a90ca7835403
info:
  name: 万户协同办公平台portletSettingId存在任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
