  author: hacktwo
  severity: medium
  description: '[!] 推断说明: 状态码缺失, 推断为 200; 原文未标注HTTP方法, 推断为GET请求。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: info-leak,unauth,2025
http:
- raw:
  - 'GET /User/ManagerList.aspx?ty=1&ty=1 HTTP/1.1

    Host: {{Hostname}}'
  redirects: false
  matchers:
