http:
- raw:
  - "方法一：\n本地需要搭建一个ollama服务\npowershell设置目标主机地址\n$env:OLLAMA_HOST=\"ip:port\"\n\n 连接后查询\nollama list\n\n调用连接地址模型\nollama run deepseek-r1:70b\n\n 方法二：\n简单粗暴的直接使用curl命令执行\ncurl your-ip:port/api/tags\n\nGET /api/tags HTTP/1.1\nContent-Type: application/x-www-form-urlencoded\nHost: {{Hostname}}\n\n方法三：\nchatbox连接访问 配置访问地址\n\n选中配置的模型"
  redirects: false
  matchers:
  - status:
    - 200
    type: status
