    9. Sec-Fetch-Dest: document

    10. Sec-Fetch-Mode: navigate

    11. Sec-Fetch-Site: same-origin

    12. Sec-Fetch-User: ?1

    13. Priority: u=0, i

    14.

    15. {"bimRequestId":"1","bimRemotePwd":"123456","bimRemoteUser":"ZGJ","bimUid":"0","fullName":"123","orgId":"xx","loginName":"18111111111","bimposition":"123","__ENABLE__":"true"}

    ![](https://cdn.nlark.com/yuque/0/2025/png/43110909/1751640785487-6c98ba26-7eff-49b7-9208-b99f8860b102.png)

    1. 用账号18111111111/666666成功登录系统'
