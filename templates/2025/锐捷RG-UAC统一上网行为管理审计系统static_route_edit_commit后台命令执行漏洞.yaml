info:
  name: 锐捷RG-UAC统一上网行为管理审计系统static_route_edit_commit后台命令执行漏洞
  author: hacktwo
  severity: critical
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
