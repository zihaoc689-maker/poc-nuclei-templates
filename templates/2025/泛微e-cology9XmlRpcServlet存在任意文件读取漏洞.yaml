id: poc-0c1009d385fbd30c5cd5
info:
  name: 泛微e-cology9XmlRpcServlet存在任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
