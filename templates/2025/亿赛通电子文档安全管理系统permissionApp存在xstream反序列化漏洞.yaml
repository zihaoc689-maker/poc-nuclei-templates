    Accept: */*

    User-Agent: Mozilla/5.0

    Connection: close

    Accept-Encoding: gzip, deflate, br

    Accept-Language: zh-CN,zh;q=0.8

    Content-Type: text/xml

    Host: {{Hostname}}

    cmd: whoami

    Content-Length: 14756


    '
  redirects: false
  matchers:
