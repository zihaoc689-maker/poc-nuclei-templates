id: poc-bc253b24d601851434b5
info:
  name: 大华智慧园区综合管理平台devicePoint_addImgIco任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
