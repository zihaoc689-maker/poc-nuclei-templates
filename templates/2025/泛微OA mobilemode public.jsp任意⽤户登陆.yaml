    也就是说这⾥的url经过aes解密之后需要⽣成⻓度为3的数组，其中第⼀个为user_id

    ![](https://cdn.nlark.com/yuque/0/2025/jpeg/43110909/1752243370482-c0dd6e5b-8c8f-4dd0-8766-9a4cbd4cf9db.jpeg)

