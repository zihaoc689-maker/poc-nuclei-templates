  name: 金和C6 Dealxml.aspx 存在XML实体注入致任意文件读取漏洞
  author: hacktwo
  severity: high
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/egs9ez9i97g8hru7'
  tags: lfi,2025
