id: poc-5907955785
info:
  name: 大华智慧园区综合管理平台bitmap接口存在任意文件上传漏洞_glgp6b2wzhcuivsz
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 状态码缺失, 推断为 200。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
